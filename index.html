<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VMI MAP - THE BIG UPDATE (8000x8000)</title>
    
    <!-- Thư viện -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <!-- Tạm ẩn Supabase SDK để chạy client test trước, khi nối thật sẽ mở lại -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script> -->
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #0c0d12; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; color: #fff; }
        button, div, input, select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        /* UI Chung */
        .glass-panel {
            background: rgba(18, 20, 29, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }
        .btn { padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .btn-close { background: #333; color: white; width: 100%; margin-top: 15px; }

        /* Sảnh chờ (Lobby) */
        #lobby-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100000; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at center, #1a1c2e 0%, #090a0f 100%); }
        .lobby-box { width: 95%; max-width: 500px; padding: 25px; text-align: center; }
        
        /* Khung Avatar Quân Đội Mới */
        .avatar-box { position: relative; width: 80px; height: 80px; margin: 0 auto 15px; }
        .avatar-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.5); }
        .avatar-badge { position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); background: #ff3333; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: bold; border: 1px solid #fff; white-space: nowrap; }

        /* 4 Maps Grid */
        .map-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; margin-bottom: 20px; }
        .map-card { padding: 15px 10px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 2px solid #333; cursor: pointer; color: #aaa; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .map-card.active { border-color: #ffd700; background: rgba(255, 215, 0, 0.15); color: #ffd700; text-shadow: 0 0 5px rgba(255,215,0,0.5); }

        /* Màn hình Game HUD */
        #game-hud { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; pointer-events: auto; }
        
        /* Cụm nút Top Right - Tách biệt Settings & Admin */
        .top-right-menu { position: absolute; top: 15px; right: 15px; display: flex; gap: 12px; pointer-events: auto; }
        .icon-btn { width: 45px; height: 45px; border-radius: 12px; background: rgba(0,0,0,0.7); border: 2px solid; color: white; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(5px); }
        .btn-settings { border-color: #aaa; }
        .btn-admin { border-color: #ff3333; display: none; } /* Ẩn nếu ko phải admin */
        .btn-inventory { border-color: #55ff55; position: absolute; bottom: 30px; right: 30px; pointer-events: auto;}

        /* Modals Chung (Settings, Admin, Inventory) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200000; justify-content: center; align-items: center; pointer-events: auto; }
        .modal-content { width: 90%; max-width: 450px; padding: 20px; max-height: 85vh; overflow-y: auto; }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; color: #ffd700; text-transform: uppercase;}

        /* UI Bảng Settings */
        .setting-group { margin-bottom: 15px; text-align: left; }
        .setting-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .setting-slider { width: 100%; accent-color: #ffd700; }
        .setting-select { width: 100%; padding: 8px; background: #111; color: white; border: 1px solid #444; border-radius: 6px; }

        /* UI Túi đồ (Inventory) */
        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .inv-slot { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid #444; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; }
        .inv-slot:active { background: rgba(255,215,0,0.2); border-color: #ffd700; }

        /* Thông báo Broadcast */
        #broadcast-msg { position: fixed; top: 20%; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: bold; color: #ff3333; text-shadow: 2px 2px 5px #000; z-index: 999999; display: none; text-align: center; white-space: nowrap;}
    </style>
</head>
<body>

    <div id="broadcast-msg">📢 LỆNH TẬP HỢP TỪ CHỈ HUY!</div>

    <!-- SẢNH CHỜ -->
    <div id="lobby-overlay">
        <div class="glass-panel lobby-box">
            <h2 style="color: #ffd700; margin-bottom: 20px; text-shadow: 0 0 10px #ffd700;">VMI MAP: THE BIG UPDATE</h2>
            
            <div class="avatar-box">
                <img id="lobby-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
                <div class="avatar-badge" id="lobby-role">BỘ BINH CƠ GIỚI</div>
            </div>
            <h3 id="lobby-name" style="margin-bottom: 20px;">Max (Player)</h3>

            <!-- 4 MAPS LỰA CHỌN -->
            <div class="map-grid">
                <div class="map-card active" onclick="selectMap(1, this)">🎯 Khu Huấn Luyện</div>
                <div class="map-card" onclick="selectMap(2, this)">🎖️ Diễu Binh</div>
                <div class="map-card" onclick="selectMap(3, this)">🏕️ Thao Trường</div>
                <div class="map-card" onclick="selectMap(4, this)">🏆 Event</div>
            </div>

            <button type="button" class="btn" style="background: #ffd700; color: #000; width: 100%; font-size: 16px;" onclick="enterGame()">VÀO BẢN ĐỒ</button>
        </div>
    </div>

    <!-- GIAO DIỆN GAME -->
    <div id="game-hud">
        <div id="joystick-zone"></div>
        
        <div class="top-right-menu">
            <button class="icon-btn btn-admin" id="btn-admin-hud" onclick="openModal('modal-admin')">🛡️</button>
            <button class="icon-btn btn-settings" onclick="openModal('modal-settings')">⚙️</button>
            <button class="icon-btn btn-settings" style="border-color: #ff5555;" onclick="exitGame()">🚪</button>
        </div>

        <button class="icon-btn btn-inventory" onclick="openModal('modal-inventory')">🎒</button>
    </div>

    <!-- MODAL: SETTINGS (Lưu LocalStorage) -->
    <div id="modal-settings" class="modal">
        <div class="glass-panel modal-content">
            <div class="modal-header">⚙️ CÀI ĐẶT TRẢI NGHIỆM</div>
            
            <div class="setting-group">
                <label>Đồ họa (Dành cho máy yếu / máy mạnh):</label>
                <select id="set-graphics" class="setting-select" onchange="applySettings()">
                    <option value="high">Cao (Đổ bóng + Chi tiết)</option>
                    <option value="low">Thấp (Tối ưu cho máy tầm trung/yếu)</option>
                </select>
            </div>
            
            <div class="setting-group">
                <label>Độ mờ JoyStick (UI Opacity): <span id="val-opacity">50%</span></label>
                <input type="range" id="set-opacity" class="setting-slider" min="10" max="100" value="50" oninput="applySettings()">
            </div>

            <div class="setting-group">
                <label>Kích cỡ JoyStick (UI Scale): <span id="val-scale">120px</span></label>
                <input type="range" id="set-scale" class="setting-slider" min="80" max="200" value="120" oninput="applySettings()">
            </div>

            <button class="btn btn-close" onclick="closeModal('modal-settings')">XONG & LƯU</button>
        </div>
    </div>

    <!-- MODAL: INVENTORY (TÚI ĐỒ) -->
    <div id="modal-inventory" class="modal">
        <div class="glass-panel modal-content">
            <div class="modal-header">🎒 BALO TRANG BỊ</div>
            <p style="font-size: 12px; color:#aaa; margin-bottom: 10px; text-align:center;">Dữ liệu lưu trên Cloud (Supabase) - Đồng bộ mọi máy</p>
            
            <div class="inventory-grid">
                <div class="inv-slot" onclick="equip('🔫')">🔫</div>
                <div class="inv-slot" onclick="equip('💣')">💣</div>
                <div class="inv-slot" onclick="equip('🪪')">🪪</div>
                <div class="inv-slot" onclick="equip('📣')">📣</div>
                <!-- Các ô trống -->
                <div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div><div class="inv-slot"></div>
            </div>

            <button class="btn btn-close" onclick="closeModal('modal-inventory')">ĐÓNG BALO</button>
        </div>
    </div>

    <!-- MODAL: ADMIN (QUẢN LÝ QUÂN SỰ) -->
    <div id="modal-admin" class="modal">
        <div class="glass-panel modal-content" style="border-color: #ff3333;">
            <div class="modal-header" style="color: #ff3333;">🛡️ BỘ TƯ LỆNH (ADMIN)</div>
            
            <div class="setting-group">
                <input type="text" id="admin-target" placeholder="ID Mục tiêu (Để trống = Tác động bản thân)" class="setting-select" style="margin-bottom: 8px;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="btn" style="background: #331111; color: #ff5555; border: 1px solid #ff5555;" onclick="adminAction('jail')">⛓️ BỎ TÙ (Jail)</button>
                <button class="btn" style="background: #331111; color: #ff5555; border: 1px solid #ff5555;" onclick="adminAction('zip')">🔗 CÒNG TAY (Zip)</button>
                <button class="btn" style="background: #331111; color: #ff5555; border: 1px solid #ff5555;" onclick="adminAction('kill')">☠️ HẠ GỤC (Kill)</button>
                <button class="btn" style="background: #113311; color: #55ff55; border: 1px solid #55ff55;" onclick="adminAction('teleport')">⚡ DỊCH CHUYỂN</button>
            </div>
            
            <button class="btn" style="width: 100%; margin-top: 10px; background: #333311; color: #ffff55; border: 1px solid #ffff55;" onclick="adminAction('broadcast')">📢 PHÁT LỆNH TẬP HỢP SERVER</button>
            <button class="btn" style="width: 100%; margin-top: 10px; background: #113311; color: #55ff55; border: 1px solid #55ff55;" onclick="adminAction('free')">🕊️ GIẢI CỨU / HỒI SINH (FREE)</button>

            <button class="btn btn-close" onclick="closeModal('modal-admin')">ĐÓNG</button>
        </div>
    </div>

    <script>
        // --- 1. HỆ THỐNG DATA HYBRID ---
        let currentMap = 1;
        let isAdmin = true; // Bật Admin cho ông test
        let game = null, scene = null, joystick = null;
        let moveVector = { x: 0, y: 0 };

        // Data Cấu hình (Lưu LocalStorage)
        let userSettings = JSON.parse(localStorage.getItem('vmi_settings')) || {
            graphics: 'high', opacity: 50, scale: 120
        };

        // Data Tài khoản (Mô phỏng Cloud Data Supabase)
        let cloudData = {
            equipped: null,
            isJailed: false,
            isZipped: false,
            isDead: false
        };

        // --- 2. HÀM GIAO DIỆN (UI/UX) ---
        function initUI() {
            // Hiển thị nút Admin nếu có quyền
            if (isAdmin) {
                document.getElementById('btn-admin-hud').style.display = 'flex';
                document.getElementById('lobby-role').innerText = "[ADMIN] CHỈ HUY";
            }
            
            // Tải Settings từ máy lên UI
            document.getElementById('set-graphics').value = userSettings.graphics;
            document.getElementById('set-opacity').value = userSettings.opacity;
            document.getElementById('set-scale').value = userSettings.scale;
            applySettings(false); // Áp dụng ngay mà không cần lưu đè
        }

        function applySettings(save = true) {
            userSettings.graphics = document.getElementById('set-graphics').value;
            userSettings.opacity = document.getElementById('set-opacity').value;
            userSettings.scale = document.getElementById('set-scale').value;
            
            document.getElementById('val-opacity').innerText = userSettings.opacity + '%';
            document.getElementById('val-scale').innerText = userSettings.scale + 'px';

            // Áp dụng HUD thật
            let joyZone = document.getElementById('joystick-zone');
            joyZone.style.opacity = userSettings.opacity / 100;
            
            // Xóa JoyStick cũ vẽ lại JoyStick mới theo Scale
            if(document.getElementById('game-hud').style.display === 'block') {
                initJoystick(); 
            }

            if (save) localStorage.setItem('vmi_settings', JSON.stringify(userSettings));
        }

        function selectMap(id, element) {
            currentMap = id;
            document.querySelectorAll('.map-card').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; moveVector = {x:0,y:0}; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function enterGame() {
            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            if (!game) initPhaser();
            initJoystick();
        }

        function exitGame() {
            document.getElementById('game-hud').style.display = 'none';
            document.getElementById('lobby-overlay').style.display = 'flex';
        }

        // --- 3. HỆ THỐNG INVENTORY & ADMIN ---
        function equip(item) {
            cloudData.equipped = item;
            if(scene && scene.equipText) scene.equipText.setText(item);
            closeModal('modal-inventory');
        }

        function adminAction(action) {
            if (!scene || !scene.player) return;
            
            switch(action) {
                case 'jail': cloudData.isJailed = true; break;
                case 'zip': cloudData.isZipped = true; break;
                case 'kill': cloudData.isDead = true; break;
                case 'free': 
                    cloudData.isJailed = false; 
                    cloudData.isZipped = false; 
                    cloudData.isDead = false; 
                    scene.player.setRotation(0);
                    break;
                case 'teleport': alert("Đã dịch chuyển (Giả lập)!"); break;
                case 'broadcast':
                    let msg = document.getElementById('broadcast-msg');
                    msg.style.display = 'block';
                    setTimeout(() => msg.style.display = 'none', 4000);
                    break;
            }
            scene.updatePlayerState();
            closeModal('modal-admin');
        }

        // --- 4. ENGINE GAME (PHASER 3) ---
        function initJoystick() {
            if(joystick) joystick.destroy();
            let size = parseInt(userSettings.scale);
            
            joystick = nipplejs.create({ 
                zone: document.getElementById('joystick-zone'), 
                mode: 'static', 
                position: { left: (size/2 + 20) + 'px', bottom: (size/2 + 20) + 'px' }, 
                color: '#ffd700', 
                size: size 
            });
            
            joystick.on('move', (evt, data) => { moveVector = { x: data.vector.x, y: -data.vector.y }; });
            joystick.on('end', () => { moveVector = { x: 0, y: 0 }; });
        }

        function initPhaser() {
            const config = {
                type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight,
                backgroundColor: '#1a1a2e', physics: { default: 'arcade' },
                scene: { preload: preloadGame, create: createGame, update: updateGame }
            };
            game = new Phaser.Game(config);
        }

        function preloadGame() { this.load.crossOrigin = 'anonymous'; }

        function createGame() {
            scene = this;
            const MAP_SIZE = 8000;
            
            // Vẽ nền Map (Đổi màu theo Map chọn)
            let mapColors = {1: 0x113311, 2: 0x222222, 3: 0x443311, 4: 0x111144};
            let gridColor = {1: 0x33ff33, 2: 0xffffff, 3: 0xffaa00, 4: 0x00ffff};
            
            this.cameras.main.setBackgroundColor(mapColors[currentMap]);
            
            this.grid = this.add.graphics();
            this.grid.lineStyle(1, gridColor[currentMap], 0.2);
            for(let i = 0; i <= MAP_SIZE; i += 100) {
                this.grid.lineBetween(i, 0, i, MAP_SIZE);
                this.grid.lineBetween(0, i, MAP_SIZE, i);
            }

            this.physics.world.setBounds(0, 0, MAP_SIZE, MAP_SIZE);
            this.player = this.add.container(MAP_SIZE / 2, MAP_SIZE / 2);
            this.physics.world.enable(this.player);
            this.player.body.setCollideWorldBounds(true);
            this.player.body.setSize(40, 40);

            // Nhân vật: Hình tròn viền Quân Đội
            let body = this.add.circle(0, 0, 20, 0x444444).setStrokeStyle(3, 0xffd700);
            this.player.add(body);

            // Icon Balo Trang bị (Hiển thị vũ khí trên tay)
            this.equipText = this.add.text(15, -15, cloudData.equipped || "", { fontSize: '20px' }).setOrigin(0.5);
            this.player.add(this.equipText);

            // Tên Nhân Vật
            this.nameText = this.add.text(0, -35, "Max", { font: 'bold 16px Arial', fill: '#fff', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5);
            this.player.add(this.nameText);

            // Tạo trước Hiệu ứng Admin
            this.jailVisual = this.add.graphics();
            this.jailVisual.lineStyle(4, 0x888888, 1);
            for(let i = -25; i <= 25; i += 12) { this.jailVisual.moveTo(i, -30); this.jailVisual.lineTo(i, 30); }
            this.jailVisual.strokePath();
            this.player.add(this.jailVisual);

            this.zipVisual = this.add.graphics();
            this.zipVisual.lineStyle(3, 0xaaaaaa, 1);
            this.zipVisual.strokeCircle(-12, 0, 8); this.zipVisual.strokeCircle(12, 0, 8); this.zipVisual.lineBetween(-4, 0, 4, 0);
            this.player.add(this.zipVisual);

            this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
            
                        // Hàm cập nhật trạng thái từ CloudData
            this.updatePlayerState = () => {
                this.jailVisual.setVisible(cloudData.isJailed);
                this.zipVisual.setVisible(cloudData.isZipped);
                if(cloudData.isDead) this.player.setRotation(Math.PI / 2); // Ngã ngang
            };
            this.updatePlayerState();
            
            window.addEventListener('resize', () => { game.scale.resize(window.innerWidth, window.innerHeight); });
        }

        function updateGame() {
            if (!scene || !scene.player) return;
            
            // KHÓA CỨNG KHI BỊ PHẠT
            if (cloudData.isDead || cloudData.isZipped || cloudData.isJailed) {
                scene.player.body.setVelocity(0, 0);
                return;
            }

            // Di chuyển
            let speed = 400; 
            let vx = moveVector.x, vy = moveVector.y;
            let length = Math.sqrt(vx*vx + vy*vy);
            if(length > 0) { vx /= length; vy /= length; }

            scene.player.body.setVelocity(vx * speed, vy * speed);
        }

        window.addEventListener('DOMContentLoaded', initUI);
    </script>
</body>
</html>
