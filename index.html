<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SERVER GAME VMI</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
:root{--bg:#0b0e14;--panel:rgba(16,22,34,.9);--line:rgba(0,229,255,.4);--cyan:#00e5ff;--gold:#e8b84b;--red:#ff3b3b;--green:#39ff88;--text:#e7edff;--hud-alpha:.9}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);font-family:Rajdhani,sans-serif;color:var(--text)}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px)}
.btn{font-family:Orbitron,sans-serif;font-size:12px;color:#fff;background:rgba(0,229,255,.1);border:1px solid var(--cyan);padding:10px 16px;cursor:pointer;text-align:center;font-weight:bold}
.btn.gold{border-color:var(--gold);background:var(--gold);color:#000}.btn.danger{border-color:var(--red);background:rgba(255,59,59,.2);color:#fff}.btn:disabled{opacity:.3;cursor:not-allowed}
#screen-menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:15px;background:radial-gradient(circle,#1a2333 0%,#0b0e14 100%)}
.lobby-box{width:100%;max-width:750px;display:flex;flex-direction:column;gap:15px;align-items:center}.title{font-family:Orbitron,sans-serif;font-size:28px;color:var(--gold);text-shadow:0 0 10px var(--gold)}
.profile-card{display:flex;align-items:center;gap:12px;padding:10px 20px;width:100%;max-width:400px;justify-content:center}.avatar{width:48px;height:48px;border-radius:50%;border:2px solid var(--cyan);overflow:hidden;background:#000}.avatar img{width:100%;height:100%;object-fit:cover}
.map-row{display:flex;flex-direction:row;gap:10px;width:100%;overflow-x:auto;padding:5px;justify-content:center}.map-card{flex:1;min-width:120px;max-width:160px;height:70px;padding:10px;cursor:pointer;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(255,255,255,.03);transition:.2s}.map-card.selected{border-color:var(--green);background:rgba(57,255,136,.15);transform:scale(1.05)}
#screen-game{position:absolute;inset:0;display:none;z-index:5;background:#000}#screen-game.active{display:block}#phaser-container{width:100%;height:100%}
.hud-element{position:absolute;z-index:20;opacity:var(--hud-alpha)}.hud-top{top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.hud-top>*{pointer-events:auto}
#joystick-zone{bottom:20px;left:20px;width:120px;height:120px}
#chatPanel{bottom:20px;right:20px;width:260px;height:160px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line)}#chatPanel.hidden-chat{display:none!important}.chat-body{flex:1;overflow-y:auto;padding:5px;font-size:11px;display:flex;flex-direction:column;gap:3px}.chat-input{display:flex;border-top:1px solid var(--line)}.chat-input input{flex:1;background:transparent;border:none;color:#fff;padding:5px;font-size:11px;outline:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100}.overlay.open{display:flex}.setting-box{width:90%;max-width:420px;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}.set-row{display:flex;justify-content:space-between;align-items:center;font-size:13px}.set-row input[type=range],.set-row select{width:50%}.edit-hud-mode .hud-element{border:2px dashed var(--gold)!important;cursor:move}
</style>
</head>
<body>
<div id="app">
<div id="screen-menu"><div class="lobby-box">
<div class="title">VMI MAP</div>
<div class="panel profile-card">
<div class="avatar" id="avatarEl"><img src="https://cdn.discordapp.com/embed/avatars/0.png"></div>
<div style="flex:1"><div id="playerNameEl" style="font-weight:bold">Chưa đăng nhập</div><div id="statusEl" style="font-size:10px;color:var(--red)">Khách</div></div>
<button class="btn" id="btnLogin">DISCORD</button><button class="btn danger" id="btnLogout" style="display:none">THOÁT</button>
</div>
<div style="font-size:12px;color:var(--cyan)">CHỌN MAP</div><div class="map-row" id="mapRow"></div>
<button id="btnEnterGame" class="btn gold" style="width:200px;height:45px" disabled>VÀO GAME</button>
</div></div>

<div id="screen-game">
<div id="phaser-container"></div>
<div class="hud-top hud-element">
<div class="panel" style="padding:6px 12px;color:var(--gold);font-weight:bold" id="mapLabel">KHU HUẤN LUYỆN</div>
<div style="display:flex;gap:8px"><button class="btn" id="btnToggleChat">💬 CHAT</button><button class="btn" id="btnOpenSettings">CÀI ĐẶT</button></div>
</div>
<div id="joystick-zone" class="hud-element"></div>
<div id="chatPanel" class="hud-element">
<div style="padding:4px 8px;background:rgba(0,0,0,.4);font-size:10px;color:var(--cyan)">TRÒ CHUYỆN</div>
<div class="chat-body" id="chatBody"></div>
<div class="chat-input"><input type="text" id="chatInput" placeholder="Nhập tin nhắn..." maxlength="60"><button class="btn" id="btnSendChat">GỬI</button></div>
</div></div>

<div class="overlay" id="settingsOverlay"><div class="panel setting-box">
<div style="font-family:Orbitron;color:var(--gold);font-size:16px;text-align:center">CÀI ĐẶT GAME</div>
<div class="set-row"><label>Độ thu phóng (Camera):</label><input type="range" id="setZoom" min=".3" max="1.5" step=".05" value=".8"></div>
<div class="set-row"><label>Âm thanh Tổng:</label><input type="range" id="setVolume" min="0" max="1" step=".1" value=".8"></div>
<div class="set-row"><label>Đồ họa (Độ nét):</label><select id="setGraphics"><option value="1">Tiêu chuẩn (1x)</option><option value="1.5" selected>Nét (1.5x)</option><option value="2">Siêu nét</option></select></div>
<div class="set-row"><label>Độ mờ HUD:</label><input type="range" id="setHudAlpha" min=".2" max="1" step=".1" value=".9"></div>
<button class="btn" id="btnEditHUD" style="border-color:var(--gold);color:var(--gold)">CHỈNH VỊ TRÍ & CỠ HUD</button>
<button class="btn danger" id="btnLeaveMap">RỜI MAP VỀ SẢNH</button><button class="btn gold" id="btnCloseSettings">LƯU & ĐÓNG</button>
</div></div></div>

<div id="errBox" style="display:none;position:fixed;inset:0;z-index:9999;background:#1a0000;color:#ff5555;padding:16px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap"></div>

<script src="map 1.js"></script>
<script src="map 2.js"></script>
<script>
window.addEventListener('error',function(e){const b=document.getElementById('errBox');b.style.display='block';b.textContent+='LỖI: '+e.message+'\\nTại dòng: '+e.lineno+':'+e.colno+'\\n\\n'});

let currentUser=null,isEditHUD=false,scene=null,game=null,joystick=null,moveVector={x:0,y:0},playerContainer=null,controlledObject=null,speechBubble=null;

function playClickSound(){try{const c=window.__audioCtx||(window.__audioCtx=new(window.AudioContext||window.webkitAudioContext)()),o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.setValueAtTime(1400,c.currentTime);o.frequency.exponentialRampToValueAtTime(900,c.currentTime+.07);g.gain.value=.05;o.connect(g).connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.09);o.stop(c.currentTime+.1)}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.btn,.map-card'))playClickSound()});

const CLIENT_ID='1534238453871673414',REDIRECT_URI=window.location.origin+window.location.pathname;
function checkDiscordAuth(){const f=new URLSearchParams(window.location.hash.slice(1)),t=f.get('access_token');if(t){fetch('https://discord.com/api/users/@me',{headers:{authorization:`Bearer ${t}`}}).then(r=>r.json()).then(u=>{if(u.id){currentUser=u;localStorage.setItem('vmi_discord_user',JSON.stringify(u));window.history.replaceState({},document.title,window.location.pathname);updateUserUI()}})}else{const s=localStorage.getItem('vmi_discord_user');if(s){currentUser=JSON.parse(s);updateUserUI()}}}
function updateUserUI(){if(!currentUser)return;const a=currentUser.avatar?`https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=256`:'https://cdn.discordapp.com/embed/avatars/0.png';document.getElementById('avatarEl').innerHTML=`<img src="${a}">`;document.getElementById('playerNameEl').textContent=currentUser.global_name||currentUser.username;document.getElementById('statusEl').textContent='● Đã xác minh';document.getElementById('statusEl').style.color='var(--green)';document.getElementById('btnLogin').style.display='none';document.getElementById('btnLogout').style.display='block';document.getElementById('btnEnterGame').disabled=false}
document.getElementById('btnLogin').onclick=()=>location.href=`https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=identify`;
document.getElementById('btnLogout').onclick=()=>{localStorage.removeItem('vmi_discord_user');location.reload()};

const MAPS=[{id:'m1',name:'KHU HUẤN LUYỆN'},{id:'m2',name:'DIỄU BINH'},{id:'m3',name:'THAO TRƯỜNG'},{id:'m4',name:'SỰ KIỆN'}];let selectedMap=MAPS[0];
MAPS.forEach(m=>{const c=document.createElement('div');c.className='map-card'+(m.id===selectedMap.id?' selected':'');c.innerHTML=`<div style="font-weight:bold;font-size:12px">${m.name}</div>`;c.onclick=()=>{document.querySelectorAll('.map-card').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');selectedMap=m;document.getElementById('mapLabel').textContent=m.name};document.getElementById('mapRow').appendChild(c)});

function preloadScene(){scene=this;if(scene.textures.exists('p_avatar'))scene.textures.remove('p_avatar');const a=currentUser&&currentUser.avatar?`https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=256`:'https://cdn.discordapp.com/embed/avatars/0.png';scene.load.image('p_avatar',a);scene.load.image('flag_vn','https://flagcdn.com/h240/vn.png');scene.load.image('tank_t90','https://commons.wikimedia.org/wiki/Special:FilePath/T-90_tank.svg?width=300');scene.load.image('btr_apc','https://commons.wikimedia.org/wiki/Special:FilePath/BTR-4%20silhouette.png?width=300')}

function createGame(){scene=this;if(selectedMap.id==='m1')createMap1(this);else if(selectedMap.id==='m2')createMap2(this);else createMap1(this)}
function updateScene(){if(!playerContainer||!playerContainer.body)return;const speed=220;playerContainer.body.setVelocity(moveVector.x*speed,moveVector.y*speed)}

function initJoystick(){const z=document.getElementById('joystick-zone');z.innerHTML='';joystick=nipplejs.create({zone:z,mode:'static',position:{left:'60px',top:'60px'},size:100,color:'#00e5ff'});joystick.on('move',(e,d)=>{if(!isEditHUD&&d&&d.vector)moveVector={x:d.vector.x,y:-d.vector.y}});joystick.on('end',()=>moveVector={x:0,y:0})}

function startGame(){document.getElementById('screen-menu').style.display='none';document.getElementById('screen-game').classList.add('active');if(game)game.destroy(true);game=new Phaser.Game({type:Phaser.AUTO,parent:'phaser-container',width:window.innerWidth,height:window.innerHeight,backgroundColor:'#111',physics:{default:'arcade',arcade:{debug:false}},scene:{preload:preloadScene,create:createGame,update:updateScene},scale:{mode:Phaser.Scale.RESIZE,autoCenter:Phaser.Scale.CENTER_BOTH}});setTimeout(initJoystick,300)}
document.getElementById('btnEnterGame').onclick=startGame;

const settingsOverlay=document.getElementById('settingsOverlay');
document.getElementById('btnOpenSettings').onclick=()=>settingsOverlay.classList.add('open');
document.getElementById('btnCloseSettings').onclick=()=>{settingsOverlay.classList.remove('open');if(isEditHUD)toggleEditHUD(false);if(scene&&scene.cameras)scene.cameras.main.setZoom(parseFloat(document.getElementById('setZoom').value));document.documentElement.style.setProperty('--hud-alpha',document.getElementById('setHudAlpha').value)};
document.getElementById('btnToggleChat').onclick=()=>{if(!isEditHUD)document.getElementById('chatPanel').classList.toggle('hidden-chat')};
document.getElementById('btnSendChat').onclick=()=>{const i=document.getElementById('chatInput'),v=i.value.trim();if(!v)return;const x=document.createElement('div');x.innerHTML=`<b style="color:var(--cyan)">${currentUser?currentUser.username:'Khách'}:</b> ${v}`;document.getElementById('chatBody').appendChild(x);showRobloxBubbleChat(v);i.value=''};
document.getElementById('btnLeaveMap').onclick=()=>{settingsOverlay.classList.remove('open');if(game){game.destroy(true);game=null}document.getElementById('screen-game').classList.remove('active');document.getElementById('screen-menu').style.display='flex'};
document.getElementById('btnEditHUD').onclick=()=>{settingsOverlay.classList.remove('open');toggleEditHUD(true)};
function toggleEditHUD(e){isEditHUD=e;const a=document.getElementById('app');if(e){a.classList.add('edit-hud-mode');makeDraggable(document.getElementById('chatPanel'));makeDraggable(document.getElementById('joystick-zone'))}else a.classList.remove('edit-hud-mode')}
function makeDraggable(el){let p1=0,p2=0,p3=0,p4=0;el.onmousedown=drag;el.ontouchstart=drag;function drag(e){if(!isEditHUD)return;e=e||window.event;const x=e.touches?e.touches[0].clientX:e.clientX,y=e.touches?e.touches[0].clientY:e.clientY;p3=x;p4=y;document.onmouseup=close;document.ontouchend=close;document.onmousemove=move;document.ontouchmove=move}function move(e){const x=e.touches?e.touches[0].clientX:e.clientX,y=e.touches?e.touches[0].clientY:e.clientY;p1=p3-x;p2=p4-y;p3=x;p4=y;el.style.top=el.offsetTop-p2+'px';el.style.left=el.offsetLeft-p1+'px';el.style.bottom='auto';el.style.right='auto'}function close(){document.onmouseup=null;document.onmousemove=null;document.ontouchend=null;document.ontouchmove=null}}
function showRobloxBubbleChat(text){if(!speechBubble)return;speechBubble.bubbleText.setText(text);const w=speechBubble.bubbleText.width+20,h=speechBubble.bubbleText.height+14;speechBubble.bubbleBg.clear();speechBubble.bubbleBg.fillStyle(0xffffff,1);speechBubble.bubbleBg.fillRoundedRect(-w/2,-h/2,w,h,8);speechBubble.setVisible(true);clearTimeout(speechBubble._t);speechBubble._t=setTimeout(()=>speechBubble.setVisible(false),3000)}
window.onload=checkDiscordAuth;window.onresize=()=>{if(game)game.scale.resize(window.innerWidth,window.innerHeight)};
</script>
</body>
    </html>
