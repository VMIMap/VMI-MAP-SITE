<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VMI MAP</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #04050a;
            --panel: rgba(9, 13, 24, 0.88);
            --line: rgba(0, 229, 255, 0.3);
            --cyan: #00e5ff;
            --gold: #e8b84b;
            --gold-soft: #ffe6ac;
            --red: #ff3b3b;
            --green: #39ff88;
            --text: #e7edff;
            --text-dim: #8494b8;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-body);
            color: var(--text);
            touch-action: none;
        }
        #app { position: relative; width: 100vw; height: 100vh; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 4px; }

        .grid-bg, .scanline, .vignette, .glow-orb {
            position: absolute; inset: 0; pointer-events: none;
        }
        .grid-bg {
            background-image: linear-gradient(rgba(0, 229, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: drift 40s linear infinite;
        }
        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: 480px 480px; }
        }
        .scanline {
            opacity: 0.3; mix-blend-mode: screen;
            background: repeating-linear-gradient(0deg, rgba(0,229,255,0.02) 0 1px, transparent 2px 4px);
        }
        .vignette { background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.75) 100%); }
        .glow-orb {
            width: 500px; height: 500px; border-radius: 50%;
            filter: blur(80px); opacity: 0.12;
        }

        .panel {
            position: relative; background: var(--panel); border: 1px solid var(--line);
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(0,229,255,0.06);
        }
        .panel::before, .panel::after {
            content: ''; position: absolute; width: 14px; height: 14px;
            border: 2px solid var(--cyan); opacity: 0.7; pointer-events: none;
        }
        .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .btn {
            font-family: var(--font-display); font-size: 13px; letter-spacing: 1.5px;
            color: var(--gold-soft); background: rgba(0,229,255,0.06);
            border: 1px solid var(--cyan); padding: 12px 20px; width: 100%;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            cursor: pointer; text-transform: uppercase; transition: all 0.15s ease;
            text-align: center; touch-action: manipulation;
        }
        .btn:hover { background: rgba(0,229,255,0.16); box-shadow: 0 0 24px rgba(0,229,255,0.35); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn.gold { border-color: var(--gold); color: #1a1200; background: linear-gradient(180deg, var(--gold-soft), var(--gold)); }
        .btn.gold:hover { box-shadow: 0 0 28px rgba(232,184,75,0.5); }
        .btn.danger { border-color: var(--red); color: #ffd6d6; }
        .btn.danger:hover { background: rgba(255,59,59,0.14); box-shadow: 0 0 20px rgba(255,59,59,0.4); }
        .btn.small { padding: 8px 14px; font-size: 10px; }

        .discord-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-family: var(--font-display); font-size: 13px; letter-spacing: 1px;
            background: rgba(88,101,242,0.15); border: 1px solid #5865F2; color: #c9cdff;
            padding: 14px; width: 100%; cursor: pointer; transition: all 0.15s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            touch-action: manipulation;
        }
        .discord-btn:hover { background: rgba(88,101,242,0.3); box-shadow: 0 0 24px rgba(88,101,242,0.4); }

        #screen-menu {
            position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; z-index: 10; padding: 20px;
        }
        .menu-wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
        .menu-title { text-align: center; margin-bottom: 6px; }
        .menu-title .t1 {
            font-family: var(--font-display); font-weight: 800; font-size: 36px; letter-spacing: 4px;
            color: var(--gold-soft); text-shadow: 0 0 18px var(--gold), 0 0 50px rgba(232,184,75,0.3); line-height: 1.1;
        }
        .menu-title .t2 { font-family: var(--font-mono); font-size: 10px; letter-spacing: 4px; color: var(--cyan); margin-top: 4px; }
        .online-badge { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--green); letter-spacing: 1.5px; }
        .online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.8s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

        .profile-card { padding: 22px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .avatar {
            width: 76px; height: 76px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display); font-size: 28px; color: #04050a;
            background: radial-gradient(circle at 35% 30%, #3a4258, #171b28);
            border: 2px solid var(--line); box-shadow: 0 0 20px rgba(0,229,255,0.12); overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .player-name { font-family: var(--font-display); font-size: 16px; letter-spacing: 1px; }
        .player-rank { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 1.5px; }

        .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 2px; }
        .map-card {
            height: 80px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end;
            position: relative; overflow: hidden; transition: all 0.15s ease; touch-action: manipulation;
        }
        .map-card:hover { transform: translateY(-2px); }
        .map-card.selected { border-color: var(--green); box-shadow: 0 0 20px rgba(57,255,136,0.25); }
        .map-card .fill { position: absolute; inset: 0; opacity: 0.5; }
        .map-card .content { position: relative; z-index: 1; }
        .map-card .map-tag { font-family: var(--font-mono); font-size: 8px; letter-spacing: 1.5px; }
        .map-card .map-name { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.5px; }

        .footer-hint { text-align: center; font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); line-height: 1.6; opacity: 0.6; }

              #screen-game { position: absolute; inset: 0; display: none; z-index: 5; background: #060a12; }
        #screen-game.active { display: block; }
        #gameCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

        .hud-el { position: absolute; z-index: 20; touch-action: none; pointer-events: auto; }
        .hud-top { top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
        .hud-top > * { pointer-events: auto; }

        .map-label { padding: 8px 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.5px; color: var(--gold-soft); display: flex; flex-direction: column; gap: 2px; }
        .map-label .coords { font-size: 9px; color: var(--text-dim); }
        .map-label .online { font-size: 9px; color: var(--green); }

        .icon-btn {
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 16px; background: var(--panel); border: 1px solid var(--line);
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            transition: 0.15s; touch-action: manipulation;
        }
        .icon-btn:hover { background: rgba(0,229,255,0.12); }
        .icon-row { display: flex; gap: 8px; }

        #joystick-zone { bottom: 30px; left: 30px; width: 130px; height: 130px; z-index: 25; }

        #chatPanel {
            bottom: 30px; left: 180px; width: 260px; max-height: 260px; display: flex; flex-direction: column;
            background: var(--panel); border: 1px solid var(--line);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            backdrop-filter: blur(8px); overflow: hidden; z-index: 20; resize: both; min-width: 180px; min-height: 100px;
        }
        #chatPanel.collapsed { max-height: 44px; min-height: 44px; }
        #chatPanel.collapsed .chat-body, #chatPanel.collapsed .chat-input-row { display: none; }
        .chat-header {
            display: flex; justify-content: space-between; align-items: center; padding: 8px 12px;
            cursor: grab; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px;
            letter-spacing: 1.5px; color: var(--cyan); flex-shrink: 0;
        }
        .chat-header span:last-child { cursor: pointer; color: var(--text-dim); }
        .chat-body { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; min-height: 60px; }
        .chat-body .msg { line-height: 1.3; word-break: break-word; }
        .chat-body .msg .tag { font-weight: 700; margin-right: 4px; }
        .chat-body .msg.sys { color: var(--gold); font-family: var(--font-mono); font-size: 10px; }
        .chat-input-row { display: flex; border-top: 1px solid var(--line); flex-shrink: 0; }
        .chat-input-row input {
            flex: 1; background: transparent; border: none; outline: none; color: var(--text);
            font-family: var(--font-body); padding: 8px 12px; font-size: 12px;
        }
        .chat-input-row button {
            background: transparent; border: none; color: var(--cyan); font-family: var(--font-mono);
            padding: 0 14px; cursor: pointer; font-size: 11px;
        }

        #fps-counter { top: 16px; right: 76px; padding: 4px 12px; font-family: var(--font-mono); font-size: 10px; color: var(--green); background: var(--panel); border: 1px solid var(--line); clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }

        .hud-dragging { outline: 2px dashed var(--gold) !important; outline-offset: 2px; background: rgba(232,184,75,0.06) !important; cursor: move !important; }

        .overlay {
            position: fixed; inset: 0; background: rgba(2,3,7,0.7); backdrop-filter: blur(6px);
            display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
        }
        .overlay.open { display: flex; }
        .overlay-panel { width: 100%; max-width: 420px; max-height: 80vh; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
        .overlay-head { display: flex; justify-content: space-between; align-items: center; }
        .overlay-head .title { font-family: var(--font-display); font-size: 18px; letter-spacing: 1px; color: var(--gold-soft); }
        .overlay-close {
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--text-dim); border: 1px solid var(--line); font-size: 16px; transition: 0.15s;
        }
        .overlay-close:hover { color: var(--red); border-color: var(--red); }

        .setting-row { display: flex; flex-direction: column; gap: 4px; }
        .setting-row label { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 1px; display: flex; justify-content: space-between; }
        .setting-row input[type="range"] { width: 100%; accent-color: var(--cyan); background: transparent; }
        .setting-row select {
            background: rgba(0,229,255,0.05); border: 1px solid var(--line); color: var(--text);
            font-family: var(--font-body); padding: 8px 10px; font-size: 13px; width: 100%;
        }
        .hud-edit-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .hud-edit-row .btn { flex: 1; min-width: 60px; padding: 8px; font-size: 10px; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            z-index: 200; padding: 10px 24px; font-family: var(--font-mono); font-size: 11px;
            letter-spacing: 1px; opacity: 0; pointer-events: none; transition: all 0.25s ease;
            background: var(--panel); border: 1px solid var(--gold); color: var(--gold-soft);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 600px) {
            .menu-title .t1 { font-size: 28px; }
            .map-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .map-card { height: 64px; }
            .map-card .map-name { font-size: 11px; }
            #joystick-zone { width: 100px; height: 100px; bottom: 20px; left: 20px; }
            #chatPanel { width: 200px; max-height: 180px; left: 130px; bottom: 20px; }
            .hud-top { top: 10px; left: 10px; right: 10px; }
            .map-label { font-size: 9px; padding: 6px 12px; }
            .icon-btn { width: 32px; height: 32px; font-size: 14px; }
            #fps-counter { font-size: 9px; padding: 2px 10px; right: 56px; top: 10px; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .menu-wrap { max-width: 360px; gap: 8px; }
            .menu-title .t1 { font-size: 26px; }
            .profile-card { padding: 14px 16px; gap: 8px; }
            .avatar { width: 56px; height: 56px; font-size: 20px; }
            .map-card { height: 56px; }
            #joystick-zone { width: 90px; height: 90px; }
            #chatPanel { max-height: 140px; width: 180px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="grid-bg"></div>
        <div class="glow-orb" style="top:-120px;left:-80px;background:var(--cyan);"></div>
        <div class="glow-orb" style="bottom:-140px;right:-100px;background:var(--gold);"></div>
        <div class="scanline"></div>
        <div class="vignette"></div>
        <div class="toast" id="toast"></div>

        <div id="screen-menu">
            <div class="menu-wrap">
                <div class="menu-title">
                    <div class="t1">VMI QUÂN ĐỘI</div>
                    <div class="t2">TACTICAL NETWORK</div>
                </div>
                <div class="online-badge">
                    <span class="online-dot"></span>
                    <span id="onlineLabel">Đang kết nối...</span>
                </div>

                <div class="panel profile-card">
                    <div class="avatar" id="avatarEl">?</div>
                    <div class="player-name" id="playerNameEl">Chưa đăng nhập</div>
                    <div class="player-rank" id="playerRankEl" style="display:none;"></div>
                    <button class="discord-btn" id="btnLogin">
                        <span>⬡</span> ĐĂNG NHẬP DISCORD
                    </button>
                    <button class="btn danger" id="btnLogout" style="display:none;">ĐĂNG XUẤT</button>
                </div>

                <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;padding:0 4px;">CHỌN BẢN ĐỒ</div>
                <div class="map-grid" id="mapGrid"></div>

                <button class="btn gold" id="btnEnterGame" disabled>🚀 VÀO GAME</button>
                <button class="btn" id="btnSettingsMenu">⚙ CÀI ĐẶT</button>

                <div class="footer-hint">
                    Đăng nhập Discord để lưu dữ liệu · HUD có thể kéo thả khi chỉnh sửa
                </div>
            </div>
        </div>

        <div id="screen-game">
            <canvas id="gameCanvas"></canvas>
            <div class="hud-top">
                <div class="panel map-label hud-el" id="mapLabel" style="position:relative;top:0;left:0;">
                    <span id="currentMapName">KHU HUẤN LUYỆN</span>
                    <span class="coords" id="coordLabel">X:0 Y:0</span>
                    <span class="online" id="onlineInMap">● 1 người</span>
                </div>
                <div class="icon-row">
                    <div class="panel icon-btn hud-el" id="btnChatToggle" title="Chat">💬</div>
                    <div class="panel icon-btn hud-el" id="btnSettingsGame" title="Cài đặt">⚙</div>
                    <div class="panel icon-btn hud-el" id="btnExitGame" title="Về sảnh">✕</div>
                </div>
            </div>
            <div class="panel hud-el" id="fps-counter">FPS: 60</div>
            <div class="hud-el" id="joystick-zone"></div>
            <div class="hud-el" id="chatPanel">
                <div class="chat-header" id="chatHeader">
                    <span>💬 CHIẾN THUẬT</span>
                    <span id="chatCollapseBtn">▁</span>
                </div>
                <div class="chat-body" id="chatBody"></div>
                <div class="chat-input-row">
                    <input id="chatInput" placeholder="Nhắn tin..." maxlength="200" />
                    <button id="chatSendBtn">GỬI</button>
                </div>
            </div>
        </div>

        <div class="overlay" id="settingsOverlay">
            <div class="panel overlay-panel">
                <div class="overlay-head">
                    <span class="title">⚙ CÀI ĐẶT</span>
                    <div class="overlay-close" id="closeSettings">✕</div>
                </div>
                <div class="setting-row">
                    <label>Đồ họa <span id="graphicsVal">Cao</span></label>
                    <select id="graphicsSelect">
                        <option value="low">Thấp</option>
                        <option value="medium">Trung bình</option>
                        <option value="high" selected>Cao</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>Zoom <span id="zoomVal">0.75x</span></label>
                    <input type="range" i
