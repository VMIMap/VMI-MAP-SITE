<!DOCTYPE html>
<html>
<head>
<title>VMI TEST GAME</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#111;
}
#login{
    position:absolute;
    top:40%;
    left:40%;
}
#game{
    display:none;
}
#info{
    position:absolute;
    color:white;
    top:10px;
    left:10px;
    font-size:20px;
}
</style>
</head>

<body>

<div id="login">
<a href="https://discord.com/oauth2/authorize?client_id=1534238453871673414&response_type=token&redirect_uri=https://domain-cua-ban.com&scope=identify">
<button>Đăng nhập Discord</button>
</a>
</div>


<div id="game">
<div id="info"></div>
<canvas id="canvas"></canvas>
</div>


<script>

let player={
 x:400,
 y:300,
 speed:5,
 name:""
};


let keys={};


window.onload=()=>{

// TEST DATA
let discord={
 username:"Tester",
 avatar:"https://cdn.discordapp.com/embed/avatars/0.png"
};


if(location.hash){
    document.getElementById("login").style.display="none";
    document.getElementById("game").style.display="block";
}


player.name=discord.username;


document.getElementById("info").innerHTML=
"👤 "+discord.username+
"<br><img width='50' src='"+discord.avatar+"'>";

startGame();

}



document.addEventListener("keydown",
e=>keys[e.key]=true);

document.addEventListener("keyup",
e=>keys[e.key]=false);



function startGame(){

let c=document.getElementById("canvas");
let ctx=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;


function loop(){

update();

draw(ctx);

requestAnimationFrame(loop);

}

loop();

}



function update(){

if(keys["w"]){
 player.y-=player.speed;
}

if(keys["s"]){
 player.y+=player.speed;
}

if(keys["a"]){
 player.x-=player.speed;
}

if(keys["d"]){
 player.x+=player.speed;
}


}



function draw(ctx){

ctx.clearRect(0,0,innerWidth,innerHeight);


// MAP
ctx.fillStyle="#356b35";
ctx.fillRect(0,0,2000,2000);


// đường
ctx.fillStyle="#777";
ctx.fillRect(300,0,100,1000);


// player
ctx.fillStyle="blue";
ctx.fillRect(
player.x,
player.y,
40,
40
);


// tên
ctx.fillStyle="white";
ctx.fillText(
player.name,
player.x,
player.y-10
);


}


</script>

</body>
</html>
