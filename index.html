<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VMI Quân Đội - UI</title>
<style>
body{margin:0;background:#090909;color:#ffd54a;font-family:Arial}
.screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
.card{width:min(92vw,420px);background:#111;border:2px solid #f00;border-radius:14px;padding:16px;box-shadow:0 0 15px #700}
button{width:100%;padding:12px;margin:8px 0;background:#1a1a1a;color:#ffd54a;border:1px solid #f00;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none}
.top{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #500}
#game{height:100vh}
.hud{position:absolute;left:10px;top:50px;transform:scale(.75);transform-origin:top left}
.chat{position:absolute;left:10px;bottom:10px;width:220px;background:#111;border:1px solid #f00}
.controls{position:absolute;right:10px;bottom:10px;transform:scale(.75);transform-origin:bottom right}
</style>
</head>
<body>
<div id="menu" class="screen">
<div class="card">
<h2 style="text-align:center">VMI QUÂN ĐỘI</h2>
<div style="text-align:center;border:1px solid #f00;padding:10px;margin-bottom:10px">
<div style="width:72px;height:72px;border-radius:50%;background:#333;margin:auto"></div>
<div>Tên người chơi</div>
<button>Đăng nhập Discord</button>
</div>
<button onclick="showGame()">VÀO GAME</button>
<button>CHỌN MAP</button>
<button onclick="toggleSettings()">CÀI ĐẶT</button>
<button>ĐĂNG XUẤT</button>
<div id="settings" class="hidden">
<hr>
<div class="grid">
<button>Đồ họa</button><button>Âm thanh</button>
<button>Giao diện</button><button>Điều khiển</button>
</div>
<p>Thu phóng HUD: <span id="v">0.75</span>x</p>
<input id="scale" type="range" min="0.5" max="1.5" step="0.05" value="0.75" oninput="upd()">
</div>
</div>
</div>

<div id="game" class="hidden">
<div class="top"><span>MENU</span><span><button onclick="back()">Rời game</button></span></div>
<div class="hud">
<div>Avatar</div><div>Tên người chơi</div>
</div>
<div class="chat"><div style="padding:6px">CHAT</div></div>
<div class="controls">
<button>Joystick</button>
<button>Kỹ năng</button>
</div>
</div>

<script>
function toggleSettings(){settings.classList.toggle('hidden')}
function showGame(){menu.classList.add('hidden');game.classList.remove('hidden')}
function back(){game.classList.add('hidden');menu.classList.remove('hidden')}
function upd(){
 let s=scale.value;
 v.textContent=s;
 document.querySelector('.hud').style.transform='scale('+s+')';
 document.querySelector('.controls').style.transform='scale('+s+')';
}
</script>
</body>
</html>
