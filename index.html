<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-6">
    <div class="max-w-xl mx-auto bg-gray-800 p-6 rounded-xl shadow-lg space-y-6">
        <h1 class="text-2xl font-bold text-indigo-400">Bảng Điều Khiển Bot</h1>

        <!-- Đổi Prefix -->
        <div class="space-y-2">
            <label class="block font-semibold">Prefix Hệ Thống:</label>
            <div class="flex gap-2">
                <input type="text" id="prefixInput" class="bg-gray-700 p-2 rounded w-full border border-gray-600">
                <button onclick="updatePrefix()" class="bg-indigo-600 px-4 py-2 rounded font-bold hover:bg-indigo-700">Lưu</button>
            </div>
        </div>

        <!-- Thêm Custom Command -->
        <div class="space-y-2">
            <label class="block font-semibold">Thêm Lệnh Tùy Chỉnh:</label>
            <input type="text" id="cmdName" placeholder="Tên lệnh (!luat)" class="bg-gray-700 p-2 rounded w-full border border-gray-600 mb-2">
            <textarea id="cmdResp" placeholder="Nội dung trả lời..." class="bg-gray-700 p-2 rounded w-full border border-gray-600"></textarea>
            <button onclick="addCommand()" class="bg-green-600 w-full py-2 rounded font-bold hover:bg-green-700">Thêm Lệnh</button>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Tải dữ liệu ban đầu
        async function loadConfig() {
            const res = await fetch(`${API_URL}/api/config`);
            const data = await res.json();
            document.getElementById('prefixInput').value = data.prefix || '!';
        }

        // Gửi Prefix mới về Bot
        async function updatePrefix() {
            const prefix = document.getElementById('prefixInput').value;
            await fetch(`${API_URL}/api/prefix`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prefix })
            });
            alert('Đã cập nhật Prefix!');
        }

        // Gửi Lệnh mới về Bot
        async function addCommand() {
            const name = document.getElementById('cmdName').value;
            const response = document.getElementById('cmdResp').value;
            await fetch(`${API_URL}/api/command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, response })
            });
            alert('Đã thêm lệnh mới!');
        }

        loadConfig();
    </script>
</body>
</html>
