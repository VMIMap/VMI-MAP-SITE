<style>

/* ==========================================================
   RESET
========================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    user-select: none;
    -webkit-user-select: none;

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #0b0e14;

    font-family: Rajdhani, sans-serif;

    color: #e7edff;
}

/* ==========================================================
   BIẾN
========================================================== */

:root {

    --bg: #0b0e14;

    --panel: rgba(16,22,34,.94);

    --line: rgba(0,229,255,.4);

    --cyan: #00e5ff;

    --gold: #e8b84b;

    --red: #ff3b3b;

    --green: #39ff88;

    --text: #e7edff;

    --hud-alpha: .9;
}

/* ==========================================================
   PANEL
========================================================== */

.panel {

    background: var(--panel);

    border: 1px solid var(--line);

    backdrop-filter: blur(8px);
}

/* ==========================================================
   BUTTON
========================================================== */

.btn {

    font-family: Orbitron, sans-serif;

    font-size: 12px;

    color: #fff;

    background: rgba(0,229,255,.1);

    border: 1px solid var(--cyan);

    padding: 10px 16px;

    cursor: pointer;

    text-align: center;

    font-weight: bold;

    transition: .2s;

    touch-action: manipulation;
}

.btn:hover {

    background:
        rgba(0,229,255,.25);
}

.btn:active {

    transform: scale(.96);
}

.btn.gold {

    border-color: var(--gold);

    background: var(--gold);

    color: #000;
}

.btn.gold:hover {

    background: #f0c85a;
}

.btn.danger {

    border-color: var(--red);

    background:
        rgba(255,59,59,.2);
}

.btn.danger:hover {

    background:
        rgba(255,59,59,.4);
}

.btn:disabled {

    opacity: .3;

    cursor: not-allowed;
}

/* ==========================================================
   SẢNH
========================================================== */

#screen-menu {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    z-index: 10;

    padding: 15px;

    background:
        radial-gradient(
            circle,
            #1a2333 0%,
            #0b0e14 100%
        );
}

.lobby-box {

    width: 100%;

    max-width: 500px;

    display: flex;

    flex-direction: column;

    gap: 15px;

    align-items: center;
}

.title {

    font-family: Orbitron, sans-serif;

    font-size: 28px;

    color: var(--gold);

    text-shadow:
        0 0 10px var(--gold);
}

/* ==========================================================
   PROFILE
========================================================== */

.profile-card {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 10px 20px;

    width: 100%;

    max-width: 400px;
}

.avatar {

    width: 48px;

    height: 48px;

    min-width: 48px;

    border-radius: 50%;

    border: 2px solid var(--cyan);

    overflow: hidden;

    background: #000;

    flex-shrink: 0;
}

.avatar img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 50%;
}

/* ==========================================================
   GAME
========================================================== */

#screen-game {

    position: absolute;

    inset: 0;

    display: none;

    z-index: 5;

    background: #000;
}

#screen-game.active {

    display: block;
}

#phaser-container {

    width: 100%;

    height: 100%;

    position: absolute;

    inset: 0;
}

/* ==========================================================
   HUD
========================================================== */

.hud-element {

    position: absolute;

    z-index: 200;

    opacity: var(--hud-alpha);
}

.hud-top {

    top: 10px;

    right: 10px;

    display: flex;

    gap: 8px;

    pointer-events: none;
}

.hud-top > * {

    pointer-events: auto;
}

/* ==========================================================
   JOYSTICK
========================================================== */

#joystick-zone {

    position: fixed;

    bottom: 20px;

    left: 20px;

    width: 120px;

    height: 120px;

    z-index: 300;

    touch-action: none;

    pointer-events: auto;
}

/* ==========================================================
   CHAT BUTTON
========================================================== */

#chat-toggle {

    position: fixed;

    top: 70px;

    left: 15px;

    z-index: 500;

    width: 50px;

    height: 50px;

    border-radius: 50%;

    background:
        rgba(11,14,20,.95);

    border: 2px solid var(--cyan);

    color: var(--cyan);

    font-size: 22px;

    display: none;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 0 15px
        rgba(0,229,255,.35);

    touch-action: manipulation;
}

#chat-toggle:hover {

    transform: scale(1.08);
}

/* ==========================================================
   CHAT WINDOW
========================================================== */

#chat-window {

    position: fixed;

    top: 130px;

    left: 15px;

    width: 290px;

    height: 330px;

    background:
        rgba(11,14,20,.97);

    border: 1px solid var(--cyan);

    border-radius: 12px;

    backdrop-filter: blur(10px);

    display: none;

    flex-direction: column;

    z-index: 600;

    box-shadow:
        0 0 30px
        rgba(0,0,0,.8);

    overflow: hidden;
}

#chat-window.open {

    display: flex;
}

/* ==========================================================
   CHAT HEADER
========================================================== */

.chat-header {

    flex: 0 0 35px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 6px 12px;

    background:
        rgba(0,229,255,.1);

    border-bottom:
        1px solid var(--line);

    font-family: Orbitron;

    font-size: 12px;

    color: var(--gold);
}

.chat-header .close-btn {

    background: none;

    border: none;

    color: var(--red);

    font-size: 18px;

    cursor: pointer;

    padding: 3px 6px;
}

/* ==========================================================
   CHAT MESSAGES
========================================================== */

.chat-messages {

    flex: 1;

    min-height: 0;

    padding: 8px 10px;

    overflow-y: auto;

    overflow-x: hidden;

    font-size: 13px;

    line-height: 1.4;

    display: flex;

    flex-direction: column;

    gap: 3px;

    scrollbar-width: thin;

    touch-action: pan-y;

    overscroll-behavior:
        contain;
}

.chat-messages::-webkit-scrollbar {

    width: 5px;
}

.chat-messages::-webkit-scrollbar-thumb {

    background:
        var(--cyan);

    border-radius: 10px;
}

.chat-messages .msg {

    padding: 3px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.05);

    word-break: break-word;

    flex-shrink: 0;
}

.chat-messages .msg.system {

    color: var(--gold);

    font-style: italic;
}

.chat-messages .msg.user {

    color: var(--text);
}

.chat-messages .msg .name {

    color: var(--cyan);

    font-weight: bold;
}

/* ==========================================================
   CHAT INPUT
========================================================== */

.chat-input-area {

    flex: 0 0 43px;

    display: flex;

    align-items: center;

    padding: 5px 6px;

    border-top:
        1px solid var(--line);

    gap: 5px;

    background:
        rgba(0,0,0,.7);

    z-index: 5;

    pointer-events: auto;
}

.chat-input-area input {

    flex: 1;

    min-width: 0;

    height: 32px;

    background:
        rgba(0,0,0,.5);

    border:
        1px solid var(--line);

    border-radius: 6px;

    padding: 5px 8px;

    color: #fff;

    font-family: Rajdhani;

    font-size: 14px;

    outline: none;

    user-select: text;

    -webkit-user-select: text;

    touch-action: auto;
}

.chat-input-area input:focus {

    border-color:
        var(--cyan);
}

.chat-input-area button {

    flex: 0 0 55px;

    height: 32px;

    background:
        var(--cyan);

    border: none;

    border-radius: 6px;

    color: #000;

    font-weight: bold;

    cursor: pointer;

    font-family: Orbitron;

    font-size: 10px;

    touch-action: manipulation;
}

/* ==========================================================
   SETTINGS
========================================================== */

.overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.85);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 1000;
}

.overlay.open {

    display: flex;
}

.setting-box {

    width: 90%;

    max-width: 420px;

    padding: 20px;

    display: flex;

    flex-direction: column;

    gap: 12px;

    max-height: 90vh;

    overflow-y: auto;
}

.set-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 13px;
}

.set-row input[type=range],
.set-row select {

    width: 50%;
}

/* ==========================================================
   EDIT HUD
========================================================== */

.edit-hud-mode
.hud-element {

    border:
        2px dashed
        var(--gold) !important;

    cursor: move;
}

/* ==========================================================
   ERROR
========================================================== */

#errBox {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 99999;

    background: #1a0000;

    color: #ff5555;

    padding: 16px;

    font-family: monospace;

    font-size: 13px;

    overflow: auto;

    white-space: pre-wrap;
}

/* ==========================================================
   MOBILE
========================================================== */

@media (max-width: 600px) {

    #chat-window {

        width: min(
            290px,
            calc(100vw - 30px)
        );

        height: 330px;
    }

    #chat-toggle {

        top: 65px;

        left: 12px;
    }

    .hud-top {

        top: 10px;

        right: 10px;
    }
}

</style>
</head>

<script>

/* ==========================================================
   BẮT LỖI
========================================================== */

window.addEventListener('error', function(e) {

    const box =
        document.getElementById('errBox');

    if (!box) return;

    box.style.display = 'block';

    box.textContent +=
        'LỖI: ' +
        e.message +
        '\nTại dòng: ' +
        e.lineno +
        ':' +
        e.colno +
        '\n\n';
});


/* ==========================================================
   BIẾN CHÍNH
========================================================== */

let currentUser = null;

let isEditHUD = false;

let scene = null;

let game = null;

let joystick = null;

let moveVector = {
    x: 0,
    y: 0
};

let playerContainer = null;

let controlledObject = null;

let playerBody = null;


/* ==========================================================
   BUBBLE PLAYER
========================================================== */

let speechBubble = null;

let speechBubbleTimer = null;


/* ==========================================================
   MULTIPLAYER
========================================================== */

let socket = null;

let otherPlayers = {};

let lastNetworkSend = 0;


/* ==========================================================
   MAP
========================================================== */

const MAP_SIZE = 3000;


/* ==========================================================
   CHAT ELEMENT
========================================================== */

const chatMessages =
    document.getElementById(
        'chat-messages'
    );

const chatInput =
    document.getElementById(
        'chat-input'
    );

const chatToggle =
    document.getElementById(
        'chat-toggle'
    );

const chatWindow =
    document.getElementById(
        'chat-window'
    );

const chatClose =
    document.getElementById(
        'chat-close'
    );

const chatSend =
    document.getElementById(
        'chat-send'
    );


/* ==========================================================
   CHAT MỞ / ĐÓNG
========================================================== */

function toggleChat(force) {

    if (
        typeof force === 'boolean'
    ) {

        chatWindow.classList.toggle(
            'open',
            force
        );

    } else {

        chatWindow.classList.toggle(
            'open'
        );
    }

}


/* ==========================================================
   NÚT CHAT
========================================================== */

chatToggle.addEventListener(
    'click',
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        toggleChat();

    }
);


chatClose.addEventListener(
    'click',
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        toggleChat(false);

    }
);


/* ==========================================================
   BUBBLE CHAT PLAYER CỦA MÌNH
========================================================== */

function showBubbleOnPlayer(
    text,
    duration = 3000
) {

    if (!speechBubble) return;

    const bg =
        speechBubble.bubbleBg;

    const txt =
        speechBubble.bubbleText;

    if (!bg || !txt) return;


    txt.setText(text);


    const padding = 12;

    const maxWidth = 220;


    let w =
        Math.min(
            (txt.width || 60) +
            padding * 2,
            maxWidth
        );


    let h =
        Math.max(
            34,
            (txt.height || 20) +
            14
        );


    bg.clear();


    bg.fillStyle(
        0xffffff,
        0.96
    );


    bg.fillRoundedRect(
        -w / 2,
        -h / 2,
        w,
        h,
        10
    );


    bg.lineStyle(
        2,
        0x00e5ff,
        1
    );


    bg.strokeRoundedRect(
        -w / 2,
        -h / 2,
        w,
        h,
        10
    );


    txt.setOrigin(
        0.5,
        0.5
    );


    txt.setPosition(
        0,
        0
    );


    speechBubble.setVisible(
        true
    );


    if (speechBubbleTimer) {

        clearTimeout(
            speechBubbleTimer
        );

    }


    speechBubbleTimer =
        setTimeout(
            function() {

                if (speechBubble) {

                    speechBubble.setVisible(
                        false
                    );

                }

                speechBubbleTimer =
                    null;

            },
            duration
        );

}


/* ==========================================================
   GỬI CHAT
========================================================== */

function sendChatMessage() {

    const text =
        chatInput.value.trim();


    if (!text) return;


    if (!currentUser) {

        addChatMessage(
            'Bạn cần đăng nhập để nhắn tin.',
            'system'
        );

        chatInput.value = '';

        return;
    }


    /* Giới hạn 999 ký tự */

    const finalText =
        text.substring(
            0,
            999
        );


    /* Nếu chưa kết nối server */

    if (
        !socket ||
        !socket.connected
    ) {

        addChatMessage(
            'Chưa kết nối server.',
            'system'
        );

        return;
    }


    /* Gửi lên server */

    socket.emit(
        'chatMessage',
        {
            text: finalText
        }
    );


    chatInput.value = '';

    chatInput.blur();

}


/* ==========================================================
   NÚT GỬI
========================================================== */

chatSend.addEventListener(
    'click',
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        sendChatMessage();

    }
);


/* ==========================================================
   ENTER ĐỂ GỬI
========================================================== */

chatInput.addEventListener(
    'keydown',
    function(e) {

        if (e.key === 'Enter') {

            e.preventDefault();

            e.stopPropagation();

            sendChatMessage();

        }

    }
);


/* ==========================================================
   THÊM TIN NHẮN
========================================================== */

function addChatMessage(
    text,
    type = 'user',
    name = ''
) {

    const msgDiv =
        document.createElement(
            'div'
        );


    msgDiv.className =
        'msg ' + type;


    if (type === 'user') {

        const nameSpan =
            document.createElement(
                'span'
            );

        nameSpan.className =
            'name';

        nameSpan.textContent =
            name;


        msgDiv.appendChild(
            nameSpan
        );


        msgDiv.appendChild(
            document.createTextNode(
                ': ' + text
            )
        );

    } else {

        msgDiv.textContent =
            text;

    }


    chatMessages.appendChild(
        msgDiv
    );


    /*
       Chỉ tự kéo xuống khi đang
       gần cuối chat.
    */

    const distanceFromBottom =
        chatMessages.scrollHeight -
        chatMessages.scrollTop -
        chatMessages.clientHeight;


    if (distanceFromBottom < 100) {

        chatMessages.scrollTop =
            chatMessages.scrollHeight;

    }

}


/* ==========================================================
   THÔNG BÁO HỆ THỐNG
========================================================== */

function systemNotice(text) {

    addChatMessage(
        text,
        'system'
    );

}


/* ==========================================================
   DISCORD
========================================================== */

const CLIENT_ID =
    '1534238453871673414';


const REDIRECT_URI =
    window.location.origin +
    window.location.pathname;


/* ==========================================================
   CHECK DISCORD LOGIN
========================================================== */

function checkDiscordAuth() {

    const hashParams =
        new URLSearchParams(
            window.location.hash.slice(1)
        );


    const token =
        hashParams.get(
            'access_token'
        );


    if (token) {

        fetch(
            'https://discord.com/api/users/@me',
            {
                headers: {
                    authorization:
                        `Bearer ${token}`
                }
            }
        )

        .then(
            r => r.json()
        )

        .then(
            user => {

                if (!user.id) {

                    systemNotice(
                        'Discord đăng nhập thất bại.'
                    );

                    return;
                }


                currentUser =
                    user;


                localStorage.setItem(
                    'vmi_discord_user',
                    JSON.stringify(user)
                );


                window.history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );


                updateUserUI();


                systemNotice(
                    '🔹 Đã đăng nhập thành công!'
                );

            }
        )

        .catch(
            err => {

                console.error(
                    'Discord auth:',
                    err
                );

            }
        );

    } else {

        const saved =
            localStorage.getItem(
                'vmi_discord_user'
            );


        if (saved) {

            try {

                currentUser =
                    JSON.parse(
                        saved
                    );


                updateUserUI();

            } catch {

                localStorage.removeItem(
                    'vmi_discord_user'
                );

            }

        }

    }

}

/* ==========================================================
   ENSURE PLAYER
   AVATAR TRÒN + TÊN + BUBBLE
========================================================== */

function ensurePlayer() {

    if (
        !scene ||
        playerContainer ||
        !scene.physics
    ) {
        return;
    }


    /* =========================
       SPAWN
    ========================= */

    const spawn =
        scene.map2Spawn || {
            x: MAP_SIZE / 2,
            y: MAP_SIZE / 2
        };


    /* =========================
       PLAYER CONTAINER
    ========================= */

    playerContainer =
        scene.add.container(
            spawn.x,
            spawn.y
        );


    playerContainer.setDepth(
        10000
    );


    /* =========================
       NỀN AVATAR
    ========================= */

    const avatarBg =
        scene.add.circle(
            0,
            0,
            34,
            0x0b0e14,
            1
        );


    avatarBg.setStrokeStyle(
        3,
        0x00e5ff,
        1
    );


    /* =========================
       AVATAR
    ========================= */

    let avatar;


    if (
        scene.textures.exists(
            'p_avatar'
        )
    ) {

        avatar =
            scene.add.image(
                0,
                0,
                'p_avatar'
            );


        avatar.setDisplaySize(
            60,
            60
        );


        avatar.setOrigin(
            0.5,
            0.5
        );


        /*
           FIX AVATAR TRÒN

           Phaser không crop trực tiếp
           bằng CSS nên dùng GeometryMask.
        */

        const maskGraphics =
            scene.make.graphics(
                {
                    x: 0,
                    y: 0,
                    add: false
                }
            );


        maskGraphics.fillStyle(
            0xffffff
        );


        maskGraphics.fillCircle(
            0,
            0,
            29
        );


        const avatarMask =
            maskGraphics.createGeometryMask();


        avatar.setMask(
            avatarMask
        );


        /*
           Lưu lại để không bị
           tìm nhầm trong update.
        */

        avatar.avatarMaskGraphics =
            maskGraphics;


    } else {

        avatar =
            scene.add.circle(
                0,
                0,
                29,
                0x00e5ff,
                1
            );


        avatar.setStrokeStyle(
            2,
            0xffffff,
            1
        );

    }


    /* =========================
       VIỀN AVATAR
    ========================= */

    const border =
        scene.add.graphics();


    border.lineStyle(
        3,
        0x00e5ff,
        1
    );


    border.strokeCircle(
        0,
        0,
        31
    );


    /* =========================
       TÊN PLAYER
    ========================= */

    const playerName =
        currentUser
            ? (
                currentUser.global_name ||
                currentUser.username
              )
            : 'Khách';


    const nameText =
        scene.add.text(
            0,
            45,
            playerName,
            {
                fontFamily:
                    'Rajdhani',
                fontSize:
                    '14px',
                fontStyle:
                    'bold',
                color:
                    '#ffffff',
                stroke:
                    '#000000',
                strokeThickness:
                    4
            }
        );


    nameText.setOrigin(
        0.5
    );


    /* =========================
       THÊM PLAYER
    ========================= */

    playerContainer.add([
        avatarBg,
        avatar,
        border,
        nameText
    ]);


    /* ======================================================
       BUBBLE CHAT
    ====================================================== */

    const bubbleBg =
        scene.add.graphics();


    const bubbleText =
        scene.add.text(
            0,
            0,
            '',
            {
                fontFamily:
                    'Rajdhani',
                fontSize:
                    '14px',
                fontStyle:
                    'bold',
                color:
                    '#000000',
                align:
                    'center',
                wordWrap: {
                    width: 190
                }
            }
        );


    bubbleText.setOrigin(
        0.5
    );


    /*
       Bubble nằm phía trên đầu
       player.
    */

    speechBubble =
        scene.add.container(
            0,
            -70
        );


    speechBubble.add([
        bubbleBg,
        bubbleText
    ]);


    speechBubble.setVisible(
        false
    );


    speechBubble.bubbleBg =
        bubbleBg;


    speechBubble.bubbleText =
        bubbleText;


    playerContainer.add(
        speechBubble
    );


    /* ======================================================
       PHYSICS
    ====================================================== */

    playerBody =
        scene.physics.add.existing(
            playerContainer
        );


    controlledObject =
        playerContainer;


    if (
        playerContainer.body
    ) {

        playerContainer.body.setCircle(
            28,
            -28,
            -28
        );


        playerContainer.body.setCollideWorldBounds(
            true
        );


        playerContainer.body.setDrag(
            800,
            800
        );

    }


    /* ======================================================
       CAMERA
    ====================================================== */

    if (
        scene.cameras &&
        scene.cameras.main
    ) {

        scene.cameras.main.startFollow(
            playerContainer,
            true,
            0.08,
            0.08
        );


        const zoom =
            parseFloat(
                document.getElementById(
                    'setZoom'
                ).value
            ) || 0.8;


        scene.cameras.main.setZoom(
            zoom
        );

    }

}

/* ==========================================================
   HIỆN BUBBLE CHAT TỪ SERVER
========================================================== */

function showPlayerBubble(
    playerId,
    text
) {

    /*
       Nếu là chính mình
       thì dùng bubble hiện tại.
    */

    if (
        playerId ===
        'self'
    ) {

        showBubbleOnPlayer(
            text,
            3000
        );

        return;

    }


    /*
       Player khác sẽ xử lý
       ở phần multiplayer.
    */

    const other =
        otherPlayers[
            playerId
        ];


    if (
        !other ||
        !other.container
    ) {
        return;
    }


    if (
        other.bubble
    ) {

        const bg =
            other.bubble.bubbleBg;

        const txt =
            other.bubble.bubbleText;


        txt.setText(
            text
        );


        const w =
            Math.min(
                (txt.width || 60) +
                20,
                220
            );


        const h =
            Math.max(
                34,
                (txt.height || 20) +
                14
            );


        bg.clear();


        bg.fillStyle(
            0xffffff,
            0.96
        );


        bg.fillRoundedRect(
            -w / 2,
            -h / 2,
            w,
            h,
            10
        );


        bg.lineStyle(
            2,
            0x00e5ff,
            1
        );


        bg.strokeRoundedRect(
            -w / 2,
            -h / 2,
            w,
            h,
            10
        );


        other.bubble.setVisible(
            true
        );


        if (
            other.bubbleTimer
        ) {

            clearTimeout(
                other.bubbleTimer
            );

        }


        other.bubbleTimer =
            setTimeout(
                function() {

                    if (
                        other.bubble
                    ) {

                        other.bubble.setVisible(
                            false
                        );

                    }

                },
                3000
            );

    }

    }

/* ==========================================================
   UPDATE SCENE
========================================================== */

function updateScene() {

    if (!scene) return;

    if (!playerContainer) {

        ensurePlayer();

        return;
    }

    if (
        !controlledObject ||
        !controlledObject.body
    ) {
        return;
    }

    const body =
        controlledObject.body;

    const speed = 180;

    let vx =
        moveVector.x || 0;

    let vy =
        moveVector.y || 0;


    /* =========================
       BÀN PHÍM
    ========================= */

    if (
        scene.input &&
        scene.input.keyboard
    ) {

        if (!scene.cursors) {

            scene.cursors =
                scene.input.keyboard
                    .createCursorKeys();
        }

        if (
            scene.cursors.left.isDown
        ) {
            vx = -1;
        }

        if (
            scene.cursors.right.isDown
        ) {
            vx = 1;
        }

        if (
            scene.cursors.up.isDown
        ) {
            vy = -1;
        }

        if (
            scene.cursors.down.isDown
        ) {
            vy = 1;
        }

    }


    /* =========================
       CHUẨN HÓA TỐC ĐỘ
    ========================= */

    const length =
        Math.sqrt(
            vx * vx +
            vy * vy
        );

    if (length > 1) {

        vx /= length;
        vy /= length;

    }


    /* =========================
       DI CHUYỂN
    ========================= */

    body.setVelocity(
        vx * speed,
        vy * speed
    );


    /* =========================
       GỬI VỊ TRÍ SERVER
    ========================= */

    if (
        socket &&
        socket.connected &&
        Date.now() -
        lastNetworkSend > 50
    ) {

        lastNetworkSend =
            Date.now();

        socket.emit(
            'move',
            {
                x:
                    playerContainer.x,

                y:
                    playerContainer.y
            }
        );

    }

}


/* ==========================================================
   PHASER UPDATE
========================================================== */

function update(

    updateScene();

}


/* ==========================================================
   JOYSTICK
========================================================== */

function setupJoystick() {

    if (
        joystick &&
        joystick.destroy
    ) {

        joystick.destroy();

    }


    const zone =
        document.getElementById(
            'joystick-zone'
        );

    if (!zone) return;

    zone.innerHTML = '';


    if (
        typeof nipplejs ===
        'undefined'
    ) {

        console.log(
            'Không có nipplejs'
        );

        return;
    }


    joystick =
        nipplejs.create({

            zone: zone,

            mode: 'static',

            position: {
                left: '60px',
                top: '60px'
            },

            color: '#00e5ff',

            size: 110,

            multitouch: true,

            restJoystick: true

        });


    /* =========================
       DI CHUYỂN
    ========================= */

    joystick.on(
        'move',
        function(evt, data) {

            if (
                !data ||
                !data.vector
            ) return;

            moveVector.x =
                data.vector.x || 0;

            moveVector.y =
                -(
                    data.vector.y || 0
                );

        }
    );


    /* =========================
       THẢ JOYSTICK
    ========================= */

    joystick.on(
        'end',
        function() {

            moveVector.x = 0;

            moveVector.y = 0;

        }
    );

}

/* ==========================================================
   SOCKET.IO
========================================================== */

/*
   THAY URL NÀY BẰNG URL SERVER CỦA BẠN

   Ví dụ:
   https://vmi-server.onrender.com

   KHÔNG thêm / ở cuối.
*/

const SERVER_URL =
    'https://vmi-map-site.onrender.com';


/* ==========================================================
   KẾT NỐI SERVER
========================================================== */

function connectServer() {

    if (
        typeof io ===
        'undefined'
    ) {

        systemNotice(
            'Không tìm thấy Socket.IO.'
        );

        console.error(
            'Socket.IO chưa được load.'
        );

        return;
    }


    if (
        socket &&
        socket.connected
    ) {

        return;
    }


    socket =
        io(
            SERVER_URL,
            {
                transports: [
                    'websocket',
                    'polling'
                ],

                reconnection: true,

                reconnectionAttempts:
                    Infinity,

                reconnectionDelay:
                    1000
            }
        );


    /* ======================================================
       CONNECT
    ====================================================== */

    socket.on(
        'connect',
        function() {

            console.log(
                'Socket connected:',
                socket.id
            );


            const name =
                currentUser
                    ? (
                        currentUser.global_name ||
                        currentUser.username
                      )
                    : 'Khách';


            socket.emit(
                'playerJoin',
                {
                    id:
                        currentUser
                            ? currentUser.id
                            : socket.id,

                    name:
                        name,

                    avatar:
                        currentUser &&
                        currentUser.avatar
                            ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=128`
                            : 'https://cdn.discordapp.com/embed/avatars/0.png'
                }
            );


            systemNotice(
                'Đã kết nối server.'
            );

        }
    );


    /* ======================================================
       DISCONNECT
    ====================================================== */

    socket.on(
        'disconnect',
        function() {

            console.log(
                'Socket disconnected'
            );


            systemNotice(
                'Mất kết nối server.'
            );

        }
    );


    /* ======================================================
       CHAT NHẬN TỪ SERVER
    ====================================================== */

    socket.on(
        'chatMessage',
        function(data) {

            if (!data) return;


            const name =
                data.name ||
                'Player';


            const text =
                data.text ||
                '';


            if (!text) return;


            /* Hiện trong chat */

            addChatMessage(
                text,
                'user',
                name
            );


            /* =========================
               BUBBLE
            ========================= */

            const playerId =
                data.id;


            /*
               Tin nhắn của chính mình
            */

            if (
                currentUser &&
                playerId ===
                currentUser.id
            ) {

                showBubbleOnPlayer(
                    text,
                    3000
                );

            }


            /*
               Tin nhắn player khác
            */

            else {

                showPlayerBubble(
                    playerId,
                    text
                );

            }

        }
    );


    /* ======================================================
       PLAYER MỚI
    ====================================================== */

    socket.on(
        'playerJoined',
        function(data) {

            if (!data) return;


            if (
                currentUser &&
                data.id ===
                currentUser.id
            ) {
                return;
            }


            createOtherPlayer(
                data
            );

        }
    );


    /* ======================================================
       DANH SÁCH PLAYER
    ====================================================== */

    socket.on(
        'players',
        function(players) {

            if (!players) return;


            Object.keys(
                players
            ).forEach(
                function(id) {

                    if (
                        currentUser &&
                        id ===
                        currentUser.id
                    ) {
                        return;
                    }


                    createOtherPlayer(
                        players[id]
                    );

                }
            );

        }
    );


    /* ======================================================
       PLAYER DI CHUYỂN
    ====================================================== */

    socket.on(
        'playerMoved',
        function(data) {

            if (!data) return;


            const other =
                otherPlayers[
                    data.id
                ];


            if (
                !other ||
                !other.container
            ) {
                return;
            }


            other.targetX =
                Number(data.x) ||
                0;


            other.targetY =
                Number(data.y) ||
                0;

        }
    );


    /* ======================================================
       PLAYER RỜI SERVER
    ====================================================== */

    socket.on(
        'playerLeft',
        function(id) {

            removeOtherPlayer(
                id
            );

        }
    );

}


/* ==========================================================
   TẠO PLAYER KHÁC
========================================================== */

function createOtherPlayer(
    data
) {

    if (
        !scene ||
        !scene.add
    ) {
        return;
    }


    if (!data || !data.id) {
        return;
    }


    /* Nếu đã tồn tại */

    if (
        otherPlayers[
            data.id
        ]
    ) {

        return;
    }


    const x =
        Number(data.x) ||
        scene.map2Spawn?.x ||
        MAP_SIZE / 2;


    const y =
        Number(data.y) ||
        scene.map2Spawn?.y ||
        MAP_SIZE / 2;


    const container =
        scene.add.container(
            x,
            y
        );


    container.setDepth(
        9999
    );


    /* ======================================================
       AVATAR NỀN
    ====================================================== */

    const bg =
        scene.add.circle(
            0,
            0,
            34,
            0x111111,
            0.95
        );


    bg.setStrokeStyle(
        3,
        0xffd700,
        1
    );


    /* ======================================================
       AVATAR
    ====================================================== */

    let avatar;


    const textureKey =
        'other_' + data.id;


    if (
        data.avatar
    ) {

        if (
            !scene.textures.exists(
                textureKey
            )
        ) {

            scene.load.image(
                textureKey,
                data.avatar
            );


            scene.load.once(
                'complete',
                function() {

                    if (
                        container &&
                        container.active &&
                        scene.textures.exists(
                            textureKey
                        )
                    ) {

                        createOtherAvatar(
                            container,
                            textureKey
                        );

                    }

                }
            );


            scene.load.start();

        }

    }


    if (
        scene.textures.exists(
            textureKey
        )
    ) {

        avatar =
            createOtherAvatar(
                container,
                textureKey
            );

    } else {

        avatar =
            scene.add.circle(
                0,
                0,
                29,
                0xff4444,
                1
            );

    }


    /* ======================================================
       TÊN
    ====================================================== */

    const name =
        data.name ||
        'Player';


    const nameText =
        scene.add.text(
            0,
            45,
            name,
            {
                fontFamily:
                    'Rajdhani',

                fontSize:
                    '14px',

                fontStyle:
                    'bold',

                color:
                    '#ffffff',

                stroke:
                    '#000000',

                strokeThickness:
                    4
            }
        );


    nameText.setOrigin(
        0.5
    );


    container.add([
        bg,
        avatar,
        nameText
    ]);


    /* ======================================================
       BUBBLE
    ====================================================== */

    const bubbleBg =
        scene.add.graphics();


    const bubbleText =
        scene.add.text(
            0,
            0,
            '',
            {
                fontFamily:
                    'Rajdhani',

                fontSize:
                    '14px',

                fontStyle:
                    'bold',

                color:
                    '#000000',

                align:
                    'center',

                wordWrap: {
                    width: 190
                }
            }
        );


    bubbleText.setOrigin(
        0.5
    );


    const bubble =
        scene.add.container(
            0,
            -70
        );


    bubble.add([
        bubbleBg,
        bubbleText
    ]);


    bubble.setVisible(
        false
    );


    bubble.bubbleBg =
        bubbleBg;


    bubble.bubbleText =
        bubbleText;


    container.add(
        bubble
    );


    /* ======================================================
       LƯU PLAYER
    ====================================================== */

    otherPlayers[
        data.id
    ] = {

        id:
            data.id,

        name:
            name,

        container:
            container,

        bubble:
            bubble,

        targetX:
            x,

        targetY:
            y,

        bubbleTimer:
            null

    };

}


/* ==========================================================
   TẠO AVATAR PLAYER KHÁC
========================================================== */

function createOtherAvatar(
    container,
    textureKey
) {

    if (
        !scene ||
        !scene.textures.exists(
            textureKey
        )
    ) {

        return scene.add.circle(
            0,
            0,
            29,
            0xff4444
        );

    }


    const avatar =
        scene.add.image(
            0,
            0,
            textureKey
        );


    avatar.setDisplaySize(
        60,
        60
    );


    avatar.setOrigin(
        0.5
    );


    /* =========================
       MASK TRÒN
    ========================= */

    const maskGraphics =
        scene.make.graphics(
            {
                x: 0,
                y: 0,
                add: false
            }
        );


    maskGraphics.fillStyle(
        0xffffff
    );


    maskGraphics.fillCircle(
        0,
        0,
        29
    );


    const mask =
        maskGraphics.createGeometryMask();


    avatar.setMask(
        mask
    );


    container.add(
        avatar
    );


    return avatar;

}


/* ==========================================================
   XÓA PLAYER KHÁC
========================================================== */

function removeOtherPlayer(
    id
) {

    const other =
        otherPlayers[id];


    if (!other) {
        return;
    }


    if (
        other.bubbleTimer
    ) {

        clearTimeout(
            other.bubbleTimer
        );

    }


    if (
        other.container
    ) {

        other.container.destroy(
            true
        );

    }


    delete otherPlayers[
        id
    ];

}


/* ==========================================================
   UPDATE PLAYER KHÁC
========================================================== */

function updateOtherPlayers() {

    Object.keys(
        otherPlayers
    ).forEach(
        function(id) {

            const other =
                otherPlayers[id];


            if (
                !other ||
                !other.container
            ) {
                return;
            }


            const targetX =
                Number(
                    other.targetX
                );


            const targetY =
                Number(
                    other.targetY
                );


            if (
                Number.isFinite(
                    targetX
                )
            ) {

                other.container.x +=
                    (
                        targetX -
                        other.container.x
                    ) * 0.25;

            }


            if (
                Number.isFinite(
                    targetY
                )
            ) {

                other.container.y +=
                    (
                        targetY -
                        other.container.y
                    ) * 0.25;

            }

        }
    );

}


/* ==========================================================
   GẮN UPDATE PLAYER KHÁC VÀO UPDATE GAME
========================================================== */

const originalUpdateScene =
    updateScene;


updateScene =
function() {

    originalUpdateScene();

    updateOtherPlayers();

};

   KẾT NỐI SERVER KHI VÀO GAME

/* ==========================================================
   BUBBLE CHAT PLAYER KHÁC
========================================================== */

function showPlayerBubble(id, text, duration = 3000) {

    const other = otherPlayers[id];

    if (
        !other ||
        !other.bubble
    ) {
        return;
    }

    const bubbleBg =
        other.bubble.bubbleBg;

    const bubbleText =
        other.bubble.bubbleText;

    if (!bubbleBg || !bubbleText) {
        return;
    }

    bubbleText.setText(text);

    const padding = 10;
    const maxWidth = 220;

    let width =
        bubbleText.width +
        padding * 2;

    if (width < 60) {
        width = 60;
    }

    if (width > maxWidth) {
        width = maxWidth;
    }

    const height = 38;

    bubbleBg.clear();

    bubbleBg.fillStyle(
        0xffffff,
        0.95
    );

    bubbleBg.fillRoundedRect(
        -width / 2,
        -height / 2,
        width,
        height,
        10
    );

    bubbleBg.lineStyle(
        2,
        0x00e5ff,
        1
    );

    bubbleBg.strokeRoundedRect(
        -width / 2,
        -height / 2,
        width,
        height,
        10
    );

    bubbleText.setPosition(
        0,
        0
    );

    other.bubble.setVisible(
        true
    );

    if (other.bubbleTimer) {
        clearTimeout(
            other.bubbleTimer
        );
    }

    other.bubbleTimer =
        setTimeout(
            function() {

                if (
                    other.bubble &&
                    other.bubble.active
                ) {

                    other.bubble.setVisible(
                        false
                    );

                }

                other.bubbleTimer = null;

            },
            duration
        );
}


/* ==========================================================
   GỬI CHAT LÊN SERVER
========================================================== */

function sendChatMessage() {

    const text =
        chatInput.value.trim();

    if (!text) {
        return;
    }

    if (!currentUser) {

        addChatMessage(
            'Bạn cần đăng nhập để nhắn tin.',
            'system'
        );

        chatInput.value = '';

        return;
    }

    const displayName =
        currentUser.global_name ||
        currentUser.username ||
        'Player';


    /* ==========================================
       NẾU CÓ SERVER → GỬI SERVER
    ========================================== */

    if (
        socket &&
        socket.connected
    ) {

        socket.emit(
            'chatMessage',
            {
                id:
                    currentUser.id,

                name:
                    displayName,

                text:
                    text
            }
        );

    } else {

        /* ======================================
           OFFLINE → VẪN HIỆN CHAT LOCAL
        ====================================== */

        addChatMessage(
            text,
            'user',
            displayName
        );

        showBubbleOnPlayer(
            text,
            3000
        );

    }


    chatInput.value = '';

    chatInput.blur();
}


/* ==========================================================
   ENTER ĐỂ GỬI CHAT
========================================================== */

chatInput.addEventListener(
    'keydown',
    function(e) {

        if (e.key === 'Enter') {

            e.preventDefault();

            sendChatMessage();

        }

    }
);


/* ==========================================================
   NÚT GỬI CHAT
========================================================== */

chatSend.addEventListener(
    'click',
    function(e) {

        e.preventDefault();

        sendChatMessage();

    }
);


/* ==========================================================
   DI CHUYỂN PLAYER LÊN SERVER
========================================================== */

let lastSentX = null;
let lastSentY = null;
let lastSentTime = 0;

function sendPlayerPosition() {

    if (
        !socket ||
        !socket.connected ||
        !currentUser ||
        !playerContainer
    ) {
        return;
    }

    const now =
        performance.now();

    /* Không gửi quá nhiều */
    if (
        now - lastSentTime < 50
    ) {
        return;
    }

    const x =
        playerContainer.x;

    const y =
        playerContainer.y;

    /* Không thay đổi thì không gửi */
    if (
        lastSentX === x &&
        lastSentY === y
    ) {
        return;
    }

    lastSentX = x;
    lastSentY = y;
    lastSentTime = now;

    socket.emit(
        'playerMove',
        {
            id:
                currentUser.id,

            x:
                x,

            y:
                y
        }
    );
}
