<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020914">
<title>Pi | 20.10 ♡</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --cyan: #39f5ff;
  --blue: #00bfe9;
  --pink: #ff9ed5;
  --text: #e7faff;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 38%, #09283a 0%, #040c19 48%, #02040a 100%);
  color: var(--text);
  font-family: "Courier New", monospace;
}

.app {
  width: 100%;
  max-width: 500px;
  height: 100vh;
  height: 100dvh;
  min-height: 420px;
  margin: 0 auto;
  padding: 20px 20px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  isolation: isolate;
}

/* Ánh sáng nền */

.ambient {
  position: absolute;
  width: 260px;
  height: 260px;
  top: 18%;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #00d9ff;
  filter: blur(110px);
  opacity: .12;
  pointer-events: none;
  z-index: -1;
}

.stars {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: -1;
  background-image:
    radial-gradient(1px 1px at 12% 17%, #b9faff 90%, transparent),
    radial-gradient(1.5px 1.5px at 82% 14%, #5ff7ff 90%, transparent),
    radial-gradient(1px 1px at 72% 39%, #fff 90%, transparent),
    radial-gradient(1px 1px at 17% 53%, #5ff7ff 90%, transparent),
    radial-gradient(1.5px 1.5px at 90% 68%, #b9faff 90%, transparent),
    radial-gradient(1px 1px at 28% 82%, #fff 90%, transparent),
    radial-gradient(1px 1px at 65% 91%, #5ff7ff 90%, transparent);
  animation: twinkle 4s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .4; }
  to { opacity: 1; }
}

/* Thanh trên */

.top {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  z-index: 2;
}

.brand {
  color: var(--cyan);
  font-size: 13px;
  letter-spacing: 2px;
  text-shadow: 0 0 12px #00dfff88;
}

.top-right {
  display: flex;
  gap: 7px;
  align-items: center;
}

.status {
  font-size: 10px;
  color: #9cb8c8;
  border: 1px solid #263d53;
  padding: 8px 9px;
  border-radius: 25px;
}

.music-btn {
  padding: 8px 10px;
  font-size: 10px;
  border-radius: 25px;
  letter-spacing: 0;
}

/* Tiến trình */

.dots {
  display: flex;
  gap: 9px;
  margin-top: 32px;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 20px;
  background: #27374a;
  transition: .3s;
}

.dot.active {
  width: 25px;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
}

/* Robot */

.robot {
  position: absolute;
  top: 34%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 24px;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
}

.robot::before {
  content: "";
  position: absolute;
  width: 230px;
  height: 150px;
  border-radius: 50%;
  background: #00dfff;
  filter: blur(65px);
  opacity: .13;
  pointer-events: none;
}

.eye {
  position: relative;
  width: 75px;
  height: 88px;
  border-radius: 26px;
  background:
    radial-gradient(ellipse at 35% 25%,
      #f1ffff 0%,
      #a5ffff 18%,
      #38efff 53%,
      #00a4d0 100%);
  box-shadow:
    0 0 13px #19eaff,
    0 0 35px #00dfff99,
    0 0 70px #00cfff33;
  animation: breathe 2.6s infinite ease-in-out;
  transition:
    height .12s,
    transform .2s,
    border-radius .2s;
}

.eye::after {
  content: "";
  position: absolute;
  top: 12px;
  left: 15px;
  width: 16px;
  height: 10px;
  border-radius: 50%;
  background: #ffffffaa;
  filter: blur(2px);
}

@keyframes breathe {
  0%, 100% {
    filter: brightness(1);
    box-shadow:
      0 0 13px #19eaff,
      0 0 35px #00dfff99,
      0 0 70px #00cfff33;
  }
  50% {
    filter: brightness(.82);
    box-shadow:
      0 0 22px #19eaff,
      0 0 55px #00dfff99,
      0 0 90px #00cfff44;
  }
}

.robot:active .eye {
  transform: scale(.92);
}

.robot.blink .eye {
  height: 7px;
  border-radius: 12px;
}

/* Hộp thoại */

.dialog {
  position: absolute;
  top: 48%;
  left: 0;
  width: 100%;
  padding: 0 25px;
  text-align: center;
  z-index: 2;
}

.message-box {
  width: 100%;
  padding: 16px 12px;
  border: 1px solid #173a50;
  border-radius: 16px;
  background: #06111dcc;
  box-shadow: 0 0 30px #00cfff0b;
  backdrop-filter: blur(8px);
}

#text {
  color: #e7faff;
  font-size: clamp(14px, 4vw, 17px);
  line-height: 1.9;
  letter-spacing: .2px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.cursor {
  display: inline-block;
  width: 8px;
  height: 17px;
  margin-left: 4px;
  background: var(--cyan);
  vertical-align: middle;
  box-shadow: 0 0 10px var(--cyan);
  animation: flash .7s infinite;
}

@keyframes flash {
  50% { opacity: 0; }
}

#gift {
  display: none;
  margin-top: 18px;
  animation: appear .6s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(10px) scale(.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Nút */

button {
  background: #071522;
  border: 1px solid #2ce9ff;
  color: #9bfaff;
  padding: 12px 17px;
  border-radius: 30px;
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 1px;
  box-shadow: 0 0 18px #00cfff22;
  cursor: pointer;
  transition: .2s;
}

button:active {
  background: #123347;
  transform: scale(.96);
}

.gift-btn {
  color: #ffb7e1;
  border-color: #ff91d0;
  box-shadow: 0 0 22px #ff71c522;
  animation: giftGlow 1.8s infinite alternate;
}

@keyframes giftGlow {
  to {
    box-shadow: 0 0 25px #ff71c566;
  }
}

.green {
  color: #6effc1;
  font-weight: bold;
}

.pink {
  color: var(--pink);
}

/* Hướng dẫn dưới */

.hint {
  position: absolute;
  bottom: 5%;
  width: 100%;
  padding: 0 15px;
  font-size: 10px;
  color: #718da1;
  line-height: 2;
  text-align: center;
  letter-spacing: 1px;
}

.hint span {
  color: #28dff5;
}

.footer {
  position: absolute;
  bottom: 1.5%;
  color: #3d5264;
  font-size: 8px;
  letter-spacing: 2px;
}

/* Màn hình nhỏ */

@media (max-height: 650px) {
  .app {
    padding-top: 12px;
  }

  .dots {
    margin-top: 18px;
  }

  .robot {
    top: 31%;
  }

  .eye {
    width: 58px;
    height: 68px;
    border-radius: 21px;
  }

  .dialog {
    top: 43%;
  }

  .message-box {
    padding: 10px;
  }

  #text {
    font-size: 13px;
    line-height: 1.65;
  }

  .hint {
    bottom: 4%;
    font-size: 9px;
  }

  .footer {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 3s !important;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="ambient"></div>
  <div class="stars"></div>

  <div class="top">
    <div class="brand">◈ PI.EXE</div>

    <div class="top-right">
      <div class="status" id="status">● ONLINE</div>
      <button class="music-btn" id="musicBtn" type="button">
        ♫ BẬT NHẠC
      </button>
    </div>
  </div>

  <div class="dots" id="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div
    class="robot"
    id="robot"
    role="button"
    tabindex="0"
    aria-label="Nhấn mắt Pi để tiếp tục"
  >
    <div class="eye"></div>
    <div class="eye"></div>
  </div>

  <div class="dialog">
    <div class="message-box">
      <span id="text"></span><span class="cursor" id="cursor"></span>

      <div id="gift">
        <button class="gift-btn" id="giftBtn" type="button">
          MỞ QUÀ 20/10 ♡
        </button>
      </div>
    </div>
  </div>

  <div class="hint" id="hint">
    TAP THE EYES TO INTERACT
    <br>
    <span>SYSTEM READY // 20.10 ♡</span>
  </div>

  <div class="footer">MADE WITH ♡ BY PI</div>

</div>

<script>
/* =========================
   PI.EXE - 20/10
   ========================= */

const text = document.getElementById("text");
const robot = document.getElementById("robot");
const gift = document.getElementById("gift");
const hint = document.getElementById("hint");
const status = document.getElementById("status");
const dots = document.querySelectorAll(".dot");
const musicBtn = document.getElementById("musicBtn");
const giftBtn = document.getElementById("giftBtn");

/* Lời thoại của Pi */

const scripts = [
  "Tớ là Pi, bé robot nhỏ xíu sống trong trang web này nè... ♡",

  "Cậu biết hôm nay là ngày gì không?",

  "Hôm nay là ngày 20/10 đó! 🌷",

  "Tớ có một điều nho nhỏ muốn nói với cậu...",

  "Tớ đã chuẩn bị một món quà đặc biệt dành riêng cho cậu.",

  "Mong cậu luôn vui vẻ, hạnh phúc và cười thật nhiều nhé! 💗",

  "Hy vọng những điều tốt đẹp nhất sẽ luôn đến với cậu.",

  "Và cuối cùng... cậu mở món quà của Pi nhé! ♡"
];

let step = 0;
let timer = null;
let typing = false;
let finished = false;
let openingGift = false;

let currentLine = "";
let currentDone = null;

/* Hiệu ứng gõ chữ */

function typeLine(line, done) {
  clearInterval(timer);

  currentLine = line;
  currentDone = done || null;

  text.textContent = "";
  typing = true;

  let i = 0;

  timer = setInterval(() => {
    text.textContent += line[i];
    i++;

    if (i >= line.length) {
      completeTyping();
    }
  }, 42);
}

/* Hoàn tất câu đang chạy */

function completeTyping() {
  if (!typing) return;

  clearInterval(timer);
  timer = null;

  text.textContent = currentLine;
  typing = false;

  const done = currentDone;
  currentDone = null;

  if (done) done();
}

/* Cập nhật chấm tiến trình */

function updateDots(index) {
  dots.forEach((dot, i) => {
    dot.classList.toggle("active", i <= index);
  });
}

/* Nhấn mắt Pi */

function next() {
  // Nếu chữ đang chạy, hiện hết câu ngay
  if (typing) {
    completeTyping();
    return;
  }

  if (finished || openingGift) return;

  // Đã đọc hết lời thoại thì hiện quà
  if (step >= scripts.length) {
    finished = true;
    gift.style.display = "block";
    hint.innerHTML =
      'PI HAS A GIFT FOR YOU ♡<br><span>NHẤN NÚT ĐỂ MỞ QUÀ</span>';
    return;
  }

  const current = step;
  const line = scripts[current];

  step++;

  updateDots(current);

  hint.textContent = "PI IS TALKING...";

  typeLine(line, () => {
    if (step < scripts.length) {
      hint.innerHTML =
        'CHẠM VÀO MẮT PI ĐỂ TIẾP TỤC<br>' +
        '<span>MESSAGE ' + step + ' / ' +
        scripts.length + '</span>';
    } else {
      hint.innerHTML =
        'CHẠM THÊM LẦN NỮA ĐỂ MỞ QUÀ<br>' +
        '<span>ALMOST THERE ♡</span>';
    }
  });
}

/* Mở quà */

function wish() {
  if (openingGift) return;

  clearInterval(timer);
  typing = false;
  currentDone = null;
  openingGift = true;

  gift.style.display = "none";

  status.textContent = "♡ FOR YOU";
  hint.textContent = "MESSAGE UNLOCKED";

  updateDots(dots.length - 1);

  const message =
    "Chúc cậu ngày 20/10 thật vui vẻ, " +
    "luôn hạnh phúc và được yêu thương. " +
    "Mong rằng mỗi ngày của cậu đều có " +
    "những niềm vui nho nhỏ, những nụ cười " +
    "thật tươi và những người luôn quan tâm cậu. " +
    "Dù hôm nay có chuyện gì xảy ra, " +
    "hãy nhớ rằng cậu vẫn xứng đáng với " +
    "những điều tốt đẹp nhất. " +
    "Cảm ơn cậu vì đã xuất hiện trên thế giới này nhé! ♡";

  typeLine(message, () => {
    text.innerHTML =
      message +
      '<br><br><span class="pink">' +
      '— Một món quà nhỏ từ Pi — ♡' +
      '</span>';

    hint.innerHTML =
      'END OF MESSAGE<br><span>THANK YOU FOR BEING HERE ♡</span>';
  });
}

/* =========================
   NHẠC NỀN TỰ TẠO
   Không cần tải file nhạc
   ========================= */

let audioContext = null;
let musicTimer = null;
let musicOn = false;
let musicIndex = 0;

/* Giai điệu nhẹ nhàng do Pi tạo */

const melody = [
  523.25, 659.25, 783.99, 659.25,
  587.33, 698.46, 880.00, 698.46,
  523.25, 659.25, 783.99, 1046.50,
  880.00, 783.99, 659.25, 587.33
];

function playNote(frequency, volume, duration, wave) {
  if (!audioContext || !musicOn) return;

  const now = audioContext.currentTime;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = wave || "sine";
  oscillator.frequency.setValueAtTime(frequency, now);

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(
    volume,
    now + 0.08
  );
  gain.gain.setValueAtTime(
    volume,
    now + Math.max(0.1, duration - 0.12)
  );
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(now);
  oscillator.stop(now + duration + 0.02);
}

function playMelody() {
  if (!musicOn) return;

  const frequency = melody[musicIndex % melody.length];

  playNote(frequency, 0.045, 0.46, "sine");

  // Thỉnh thoảng thêm nốt trầm tạo cảm giác êm dịu
  if (musicIndex % 4 === 0) {
    const bassNotes = [261.63, 196.00, 220.00, 174.61];
    const bass = bassNotes[
      Math.floor(musicIndex / 4) % bassNotes.length
    ];

    playNote(bass, 0.018, 1.7, "sine");
  }

  musicIndex++;
}

async function toggleMusic() {
  const AudioEngine =
    window.AudioContext || window.webkitAudioContext;

  if (!AudioEngine) {
    hint.textContent = "TRÌNH DUYỆT KHÔNG HỖ TRỢ NHẠC NỀN";
    return;
  }

  if (musicOn) {
    musicOn = false;
    clearInterval(musicTimer);
    musicTimer = null;

    musicBtn.textContent = "♫ BẬT NHẠC";

    if (audioContext && audioContext.state === "running") {
      audioContext.suspend();
    }

    return;
  }

  try {
    if (!audioContext) {
      audioContext = new AudioEngine();
    }

    await audioContext.resume();

    musicOn = true;
    musicIndex = 0;

    musicBtn.textContent = "♫ TẮT NHẠC";

    playMelody();
    musicTimer = setInterval(playMelody, 520);
  } catch (error) {
    musicOn = false;
    musicBtn.textContent = "♫ THỬ LẠI";
    hint.textContent = "KHÔNG THỂ KHỞI ĐỘNG NHẠC";
  }
}

/* =========================
   SỰ KIỆN
   ========================= */

robot.addEventListener("click", next);

robot.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    next();
  }
});

musicBtn.addEventListener("click", toggleMusic);
giftBtn.addEventListener("click", wish);

/* Robot thỉnh thoảng chớp mắt */

function blink() {
  robot.classList.add("blink");

  setTimeout(() => {
    robot.classList.remove("blink");
  }, 160);
}

function scheduleBlink() {
  setTimeout(() => {
    blink();
    scheduleBlink();
  }, 2500 + Math.random() * 3500);
}

scheduleBlink();

/* Bắt đầu cuộc hội thoại */

setTimeout(next, 900);
</script>

</body>
</html>
