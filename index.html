<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VMI MAP - VIP ADMIN EDITION</title>
    
    <!-- Thư viện -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    
    <style>
        /* ================= RESET & CƠ BẢN ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; background-color: #0f0f13; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; color: #fff; }
        
        /* Loại bỏ highlight khi chạm trên Mobile */
        button, div, a { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        /* ================= STYLE VIP GLASSMORPHISM ================= */
        .glass-panel {
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .gold-border { border: 1px solid #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .gold-text { color: #ffd700; text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }

        /* ================= BUTTONS ================= */
        .btn {
            padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; pointer-events: auto !important; z-index: 99999; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        .btn-discord { background: linear-gradient(135deg, #5865F2, #4752C4); color: white; width: 100%; padding: 15px; font-size: 16px; }
        .btn-play { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; padding: 15px 30px; font-size: 18px; margin-top: 15px; width: 100%; }
        .btn-admin { background: #ff3333; color: white; border: 1px solid #ffaaaa; }
        .btn-close { background: #333; color: white; }
        

             <div id="lobby-overlay">
        <div class="glass-panel lobby-box gold-border">
            <h2 class="gold-text" style="margin-bottom: 20px; font-size: 26px;">VMI MAP VIP</h2>
            
            <div id="auth-section">
                <p style="margin-bottom: 15px; color: #ccc; font-size: 14px;">Đăng nhập để vào Server</p>
                <a id="btn-discord-link" 
                   href="https://discord.com/api/oauth2/authorize?client_id=1534238453871673414&redirect_uri=https%3A%2F%2Fvmimap.github.io%2FVMI-MAP-SITE%2F&response_type=token&scope=identify" 
                   class="btn btn-discord" 
                   style="display: block; text-decoration: none; text-align: center;">
                   ĐĂNG NHẬP DISCORD
                </a>
            </div>

            <div id="user-section" style="display: none;">
                <div class="avatar-box">
                    <img id="lobby-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
                    <h3 id="lobby-name" style="margin-bottom: 5px;">Player</h3>
                    <span id="lobby-role" style="font-size: 12px; color: #ffaa00; background: rgba(255,170,0,0.2); padding: 2px 8px; border-radius: 10px;">Thành viên</span>
                </div>

                <div class="map-selector">
                    <button type="button" id="map-1" class="map-card active" onclick="selectMap(1)">Bản đồ 1</button>
                    <button type="button" id="map-2" class="map-card" onclick="selectMap(2)">Bản đồ 2</button>
                </div>

                <button type="button" class="btn btn-play" onclick="enterGame()">VÀO GAME</button>
                <button type="button" class="btn" style="background: transparent; border: 1px solid #555; color: #aaa; margin-top: 10px; width: 100%;" onclick="logout()">Đăng xuất</button>
            </div>
        </div>
    </div>

    <!-- IN-GAME HUD -->
    <div id="game-hud">
        <div id="joystick-zone"></div>
        
        <div class="top-right-menu">
            <button type="button" class="icon-btn" onclick="openModal('admin-modal')" id="btn-admin-hud" style="display: none; color: #ff3333; border-color: #ff3333;">⚙️</button>
            <button type="button" class="icon-btn" onclick="openModal('settings-modal')">🔧</button>
            <button type="button" class="icon-btn" onclick="exitGame()">🚪</button>
        </div>

        <div id="chat-container" class="glass-panel">
            <div id="chat-history"></div>
            <div class="chat-input-box">
                <input type="text" id="chat-input" placeholder="Nhập tin nhắn hoặc lệnh (/...)" onkeypress="if(event.key === 'Enter') sendChat()">
                <button type="button" onclick="sendChat()">Gửi</button>
            </div>
        </div>
    </div>

    <!-- MODAL CÀI ĐẶT -->
    <div id="settings-modal" class="modal">
        <div class="glass-panel modal-content">
            <div class="modal-header">CÀI ĐẶT GIAO DIỆN</div>
            
            <div class="setting-group">
                <label>Độ thu phóng (Camera Zoom): <span id="val-zoom">0.75x</span></label>
                <input type="range" id="slider-zoom" min="0.3" max="2" step="0.05" value="0.75" oninput="updateSettings()">
            </div>
            
            <div class="setting-group">
                <label>Độ mờ HUD (Opacity): <span id="val-opacity">0.75</span></label>
                <input type="range" id="slider-opacity" min="0.1" max="1" step="0.05" value="0.75" oninput="updateSettings()">
            </div>
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="btn btn-close" style="flex: 1;" onclick="closeModal('settings-modal')">Đóng</button>
            </div>
        </div>
    </div>

    <!-- MODAL ADMIN PANEL VIP -->
    <div id="admin-modal" class="modal">
        <div class="glass-panel modal-content gold-border">
            <div class="modal-header gold-text" style="color: #ff3333;">CONTROL PANEL ADMIN</div>
            
            <div class="admin-input-group">
                <input type="text" id="admin-target" class="admin-input" placeholder="Nhập tên người chơi hoặc thông số...">
            </div>

            <div class="admin-grid">
                <button type="button" class="admin-btn" onclick="adminAction('color')">Đổi Màu Tên (Hex)</button>
                <button type="button" class="admin-btn" onclick="adminAction('tp')">TP (x,y)</button>
                <button type="button" class="admin-btn" onclick="adminAction('to')">TP Tới (To)</button>
                <button type="button" class="admin-btn" onclick="adminAction('bring')">Bring (Kéo về)</button>
                <button type="button" class="admin-btn" onclick="adminAction('kick')">Kick</button>
                <button type="button" class="admin-btn" onclick="adminAction('ban')">Ban</button>
                <button type="button" class="admin-btn" onclick="adminAction('view')">View (Spectate)</button>
                <button type="button" class="admin-btn" onclick="adminAction('giveperm')">Give Perm</button>
                <button type="button" class="admin-btn" onclick="adminAction('givemod')">Temp Mod (1D)</button>
            </div>

            <button type="button" class="btn btn-close" style="width: 100%;" onclick="closeModal('admin-modal')">Đóng Panel</button>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // --- BIẾN TOÀN CỤC ---
        let user = null;
        let isAdmin = false; 
        let selectedMapID = 1;
        let game, scene;
        let joystick;
        let moveVector = { x: 0, y: 0 };
        
        // --- HỆ THỐNG XÁC THỰC DISCORD ---
        function checkAuth() {
            const hash = window.location.hash;
            let token = new URLSearchParams(hash.substring(1)).get('access_token');
            
            if (token) {
                window.history.replaceState(null, null, window.location.pathname);
                fetch('https://discord.com/api/users/@me', { headers: { authorization: `Bearer ${token}` } })
                .then(r => r.json())
                .then(data => {
                    if(data.id) {
                        user = {
                            id: data.id,
                            name: data.global_name || data.username,
                            avatar: data.avatar ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png` : `https://cdn.discordapp.com/embed/avatars/0.png`
                        };
                        localStorage.setItem('vmi_user', JSON.stringify(user));
                        checkAdminStatus();
                        updateLobby();
                    }
                });
            } else {
                let saved = localStorage.getItem('vmi_user');
                if (saved) { 
                    user = JSON.parse(saved); 
                    checkAdminStatus();
                    updateLobby(); 
                }
            }
        }

        function logout() {
            user = null; isAdmin = false;
            localStorage.removeItem('vmi_user');
            localStorage.removeItem('vmi_temp_mod');
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('user-section').style.display = 'none';
        }

        // --- HỆ THỐNG ADMIN / TEMP MOD ---
        function checkAdminStatus() {
            isAdmin = true; 
            
            let tempModExpiry = localStorage.getItem('vmi_temp_mod');
            if (tempModExpiry && Date.now() < parseInt(tempModExpiry)) {
                isAdmin = true;
            } else if (tempModExpiry) {
                localStorage.removeItem('vmi_temp_mod');
            }

            if (isAdmin) {
                document.getElementById('lobby-role').innerText = "V.I.P Admin";
                document.getElementById('lobby-role').style.color = "#ff3333";
                document.getElementById('lobby-role').style.background = "rgba(255, 51, 51, 0.2)";
                document.getElementById('btn-admin-hud').style.display = 'block';
            }
        }

        // --- GIAO DIỆN & MODAL ---
        function updateLobby() {
            if(user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-section').style.display = 'block';
                document.getElementById('lobby-avatar').src = user.avatar;
                document.getElementById('lobby-name').innerText = user.name;
            }
        }

        function selectMap(id) {
            selectedMapID = id;
            const btn1 = document.getElementById('map-1');
            const btn2 = document.getElementById('map-2');
            if (btn1 && btn2) {
                btn1.classList.remove('active');
                btn2.classList.remove('active');
                document.getElementById(`map-${id}`).classList.add('active');
            }
            if (scene && typeof scene.changeMap === 'function') {
                scene.changeMap(id);
            }
            showNotif(`Đã chọn Bản đồ ${id}`);
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function showNotif(msg) {
            const n = document.getElementById('notification');
            n.innerText = msg;
            n.style.display = 'block';
            setTimeout(() => { n.style.display = 'none'; }, 3000);
        }

        function updateSettings() {
            const zoom = document.getElementById('slider-zoom').value;
            const opacity = document.getElementById('slider-opacity').value;
            
            document.getElementById('val-zoom').innerText = zoom + "x";
            document.getElementById('val-opacity').innerText = opacity;
            
            document.getElementById('game-hud').style.opacity = opacity;
            if(scene) scene.cameras.main.setZoom(parseFloat(zoom));
        }

        // --- ADMIN ACTIONS ---
        function adminAction(action) {
            const target = document.getElementById('admin-target').value.trim();
            if (!target && action !== 'tp') { showNotif("Vui lòng nhập mục tiêu/thông số!"); return; }

            switch(action) {
                case 'color':
                    if (scene) scene.nameText.setColor(target);
                    showNotif(`Đã đổi màu tên thành: ${target}`);
                    break;
                case 'tp':
                    if(scene) {
                        let coords = target.split(' ');
                        let tx = coords[0] ? parseInt(coords[0]) : Math.random() * 2000;
                        let ty = coords[1] ? parseInt(coords[1]) : Math.random() * 2000;
                        scene.player.setPosition(tx, ty);
                        showNotif(`Dịch chuyển tới tọa độ: ${tx}, ${ty}`);
                    }
                    break;
                case 'to': showNotif(`Đã dịch chuyển tới người chơi: ${target}`); break;
                case 'bring': showNotif(`Đã kéo (Bring) ${target} tới vị trí của bạn`); break;
                case 'kick': showNotif(`Đã Kick người chơi: ${target}`); break;
                case 'ban': showNotif(`Đã BAN vĩnh viễn: ${target}`); break;
                case 'view': showNotif(`Đang theo dõi góc nhìn của: ${target}`); break;
                case 'giveperm': showNotif(`Đã cấp quyền vĩnh viễn cho: ${target}`); break;
                case 'givemod': 
                    let expiry = Date.now() + (24 * 60 * 60 * 1000);
                    localStorage.setItem('vmi_temp_mod', expiry.toString());
                    showNotif(`Đã cấp Temp Mod (1 Ngày) cho: ${target}`);
                    break;
            }
            closeModal('admin-modal');
        }

        // --- CHAT & PARSER LỆNH ---
        function sendChat() {
            const input = document.getElementById('chat-input');
            let text = input.value.trim();
            if(!text) return;
            
            if (text.startsWith('/')) {
                if (!isAdmin) { showNotif("Bạn không có quyền dùng lệnh!"); return; }
                let args = text.split(' ');
                let cmd = args[0].toLowerCase();
                
                if(cmd === '/color' && args[1]) {
                    if (scene) scene.nameText.setColor(args[1]);
                    showNotif("Đổi màu thành công!");
                } else if (cmd === '/tp' && args[1] && args[2]) {
                    if(scene) scene.player.setPosition(parseInt(args[1]), parseInt(args[2]));
                } else {
                    showNotif("Thực thi lệnh: " + cmd);
                }
            } else {
                const history = document.getElementById('chat-history');
                let colorHex = scene ? scene.nameText.style.color : "#fff";
                history.innerHTML += `<div><b style="color:${colorHex}">${user ? user.name : 'Khách'}:</b> ${text}</div>`;
                history.scrollTop = history.scrollHeight;
                
                if (scene) scene.showChatBubble(text);
            }
            input.value = '';
        }

        // --- QUẢN LÝ GAME (PHASER + NIPPLEJS) ---
        function enterGame() {
            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('game-hud').style.display = 'block';
            
            updateSettings();

            if (!game) initPhaser();
            initJoystick();
        }

        function exitGame() {
            document.getElementById('game-hud').style.display = 'none';
            document.getElementById('lobby-overlay').style.display = 'flex';
            if (joystick) { joystick.destroy(); joystick = null; }
        }

        function initJoystick() {
            if (joystick) joystick.destroy();
            joystick = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static', position: { left: '60px', bottom: '60px' },
                color: '#ffd700', size: 100
            });
            joystick.on('move', (evt, data) => { moveVector = { x: data.vector.x, y: -data.vector.y }; });
            joystick.on('end', () => { moveVector = { x: 0, y: 0 }; });
        }

        function initPhaser() {
            const config = {
                type: Phaser.AUTO, width: window.innerWidth, height: window.innerHeight,
                backgroundColor: '#1a1a2e',
                physics: { default: 'arcade' },
                scene: { create: createGame, update: updateGame }
            };
            game = new Phaser.Game(config);
        }

        function createGame() {
            scene = this;
            
            this.grid = this.add.graphics();
            this.changeMap = function(id) {
                this.grid.clear();
                let color = id === 1 ? 0x222233 : 0x2a3a2a;
                this.cameras.main.setBackgroundColor(color);
                this.grid.lineStyle(1, 0xffffff, 0.1);
                for(let i=0; i<=2000; i+=50) {
                    this.grid.lineBetween(i, 0, i, 2000);
                    this.grid.lineBetween(0, i, 2000, i);
                }
            };
            this.changeMap(selectedMapID);
            this.physics.world.setBounds(0, 0, 2000, 2000);

            this.player = this.add.container(1000, 1000);
            this.physics.world.enable(this.player);
            this.player.body.setCollideWorldBounds(true);
            this.player.body.setSize(40, 40);

            let body = this.add.circle(0, 0, 20, 0xffd700).setStrokeStyle(2, 0xffffff);
            this.player.add(body);

            this.nameText = this.add.text(0, -35, user ? user.name : "Player", {
                font: 'bold 16px Arial', fill: '#ffffff', stroke: '#000000', strokeThickness: 4
            }).setOrigin(0.5);
            this.player.add(this.nameText);

            this.chatBubble = this.add.text(0, -60, "", {
                font: '14px Arial', fill: '#000', backgroundColor: '#fff', padding: { x: 5, y: 3 }
            }).setOrigin(0.5).setVisible(false);
            this.player.add(this.chatBubble);
            
            let bubbleTimer;
            this.showChatBubble = (txt) => {
                this.chatBubble.setText(txt).setVisible(true);
                clearTimeout(bubbleTimer);
                bubbleTimer = setTimeout(() => this.chatBubble.setVisible(false), 4000);
            }

            this.cameras.main.startFollow(this.player, true, 0.1, 0.1);
            let defaultZoom = parseFloat(document.getElementById('slider-zoom').value);
            this.cameras.main.setZoom(defaultZoom);

            this.cursors = this.input.keyboard.createCursorKeys();
            this.wasd = this.input.keyboard.addKeys({ W: 87, A: 65, S: 83, D: 68 });
            
            window.addEventListener('resize', () => { game.scale.resize(window.innerWidth, window.innerHeight); });
        }

        function updateGame() {
            if (!scene || !scene.player) return;
            const speed = 300;
            let vx = 0, vy = 0;

            if (scene.cursors.left.isDown || scene.wasd.A.isDown) vx = -1;
            else if (scene.cursors.right.isDown || scene.wasd.D.isDown) vx = 1;
            if (scene.cursors.up.isDown || scene.wasd.W.isDown) vy = -1;
            else if (scene.cursors.down.isDown || scene.wasd.S.isDown) vy = 1;

            if (moveVector.x !== 0 || moveVector.y !== 0) { vx = moveVector.x; vy = moveVector.y; }

            let length = Math.sqrt(vx*vx + vy*vy);
            if(length > 0) { vx /= length; vy /= length; }

            scene.player.body.setVelocity(vx * speed, vy * speed);
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            const discordBtn = document.getElementById('btn-discord-link');
            if (discordBtn) {
                discordBtn.addEventListener('touchend', () => {
                    window.location.href = discordBtn.href;
                });
            }
        });
    </script>
</body>
</html>
