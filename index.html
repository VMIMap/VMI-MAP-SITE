<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VMI Game</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}

#menu{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    gap:15px;
}

#game{
    display:none;
    width:100vw;
    height:100vh;
    background:#2f7d32;
    position:relative;
}

button{
    padding:12px 25px;
    font-size:18px;
}

select{
    padding:10px;
    font-size:16px;
}

#player{
    width:40px;
    height:40px;
    background:red;
    position:absolute;
    left:100px;
    top:100px;
}
</style>

</head>
<body>

<div id="menu">

<h1>VMI GAME</h1>

<button id="loginBtn">
Đăng nhập Discord
</button>

<select id="map" disabled>
<option value="">Chọn map</option>
<option>Khu huấn luyện</option>
<option>Doanh trại</option>
<option>Chiến trường</option>
</select>

<button id="playBtn" disabled>
Vào game
</button>

</div>

<div id="game">
<div id="player"></div>
</div>

<script>

let username=null;

loginBtn.onclick=()=>{

const name=prompt("Tên Discord:");

if(!name)return;

username=name;

alert("Xin chào "+name);

map.disabled=false;

}

playBtn.onclick=()=>{

if(!username){
alert("Đăng nhập trước");
return;
}

if(map.value==""){
alert("Chọn map");
return;
}

menu.style.display="none";
game.style.display="block";

}

map.onchange=()=>{

playBtn.disabled=(map.value=="");

}

// Di chuyển

const player=document.getElementById("player");

let x=100;
let y=100;

document.addEventListener("keydown",(e)=>{

if(game.style.display!="block") return;

if(e.key=="w") y-=10;
if(e.key=="s") y+=10;
if(e.key=="a") x-=10;
if(e.key=="d") x+=10;

player.style.left=x+"px";
player.style.top=y+"px";

});

</script>

</body>
</html>
