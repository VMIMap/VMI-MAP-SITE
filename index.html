<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SERVER GAME VMI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        :root {
            --bg: #0b0e14;
            --panel: rgba(16, 22, 34, 0.9);
            --line: rgba(0, 229, 255, 0.4);
            --cyan: #00e5ff;
            --gold: #e8b84b;
            --red: #ff3b3b;
            --green: #39ff88;
            --text: #e7edff;
            --hud-alpha: 0.9;
        }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); font-family: 'Rajdhani', sans-serif; color: var(--text); }
        
        /* GENERAL UI */
        .panel { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); }
        .btn {
            font-family: 'Orbitron', sans-serif; font-size: 12px; color: #fff; background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--cyan); padding: 10px 16px; cursor: pointer; text-align: center; font-weight: bold;
        }
        .btn.gold { border-color: var(--gold); background: var(--gold); color: #000; }
        .btn.danger { border-color: var(--red); background: rgba(255, 59, 59, 0.2); color: #fff; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* SẢNH (LOBBY) */
        #screen-menu {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; padding: 15px; background: radial-gradient(circle, #1a2333 0%, #0b0e14 100%);
        }
        .lobby-box { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .title { font-family: 'Orbitron', sans-serif; font-size: 28px; color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        
        .profile-card { display: flex; align-items: center; gap: 12px; padding: 10px 20px; width: 100%; max-width: 400px; justify-content: center; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--cyan); overflow: hidden; background: #000; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* MAP NẰM NGANG */
        .map-row { display: flex; flex-direction: row; gap: 10px; width: 100%; overflow-x: auto; padding: 5px; justify-content: center; }
        .map-card {
            flex: 1; min-width: 120px; max-width: 160px; height: 70px; padding: 10px; cursor: pointer;
            border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.03); transition: 0.2s;
        }
        .map-card.selected { border-color: var(--green); background: rgba(57, 255, 136, 0.15); transform: scale(1.05); }

        /* IN-GAME HUD */
        #screen-game { position: absolute; inset: 0; display: none; z-index: 5; background: #000; }
        #screen-game.active { display: block; }
        #phaser-container { width: 100%; height: 100%; }

        .hud-element { position: absolute; z-index: 20; opacity: var(--hud-alpha); }
        .hud-top { top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
        .hud-top > * { pointer-events: auto; }

        #joystick-zone { bottom: 20px; left: 20px; width: 120px; height: 120px; }

        /* CHAT */
        #chatPanel {
            bottom: 20px; right: 20px; width: 260px; height: 160px; display: flex; flex-direction: column;
            background: var(--panel); border: 1px solid var(--line); transition: opacity 0.2s;
        }
        #chatPanel.hidden-chat { display: none !important; }
        .chat-body { flex: 1; overflow-y: auto; padding: 5px; font-size: 11px; display: flex; flex-direction: column; gap: 3px; }
        .chat-input { display: flex; border-top: 1px solid var(--line); }
        .chat-input input { flex: 1; background: transparent; border: none; color: #fff; padding: 5px; font-size: 11px; outline: none; }

        /* SETTINGS OVERLAY */
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
        .overlay.open { display: flex; }
        .setting-box { width: 90%; max-width: 420px; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; }
        .set-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .set-row input[type=range], .set-row select { width: 50%; }

        /* CHẾ ĐỘ EDIT HUD */
        .edit-hud-mode .hud-element { border: 2px dashed var(--gold) !important; cursor: move; }
    </style>
</head>
<body>
    <div id="app">
        <!-- SẢNH GAME (LOBBY) -->
        <div id="screen-menu">
            <div class="lobby-box">
                <div class="title">VMI MAP</div>

                <div class="panel profile-card">
                    <div class="avatar" id="avatarEl"><img src="https://cdn.discordapp.com/embed/avatars/0.png"></div>
                    <div style="flex:1;">
                        <div id="playerNameEl" style="font-weight:bold;">Chưa đăng nhập</div>
                        <div id="statusEl" style="font-size:10px; color:var(--red);">Khách</div>
                    </div>
                    <button class="btn" id="btnLogin">DISCORD</button>
                    <button class="btn danger" id="btnLogout" style="display:none;">THOÁT</button>
                </div>

                <div style="font-size:12px; color:var(--cyan);">CHỌN MAP</div>
                <div class="map-row" id="mapRow"></div>

                <button id="btnEnterGame" class="btn gold" style="width:200px; height:45px;" disabled>VÀO GAME</button>
            </div>
        </div>

        <!-- MAN HINH GAME -->
        <div id="screen-game">
            <div id="phaser-container"></div>

            <div class="hud-top hud-element">
                <div class="panel" style="padding:6px 12px; color:var(--gold); font-weight:bold;" id="mapLabel">KHU HUẤN LUYỆN</div>
                <div style="display:flex; gap:8px;">
                    <button class="btn" id="btnToggleChat">💬 CHAT</button>
                    <button class="btn" id="btnOpenSettings">CÀI ĐẶT</button>
                </div>
            </div>

            <div id="joystick-zone" class="hud-element"></div>

            <div id="chatPanel" class="hud-element">
                <div style="padding:4px 8px; background:rgba(0,0,0,0.4); font-size:10px; color:var(--cyan);">TRÒ CHUYỆN</div>
                <div class="chat-body" id="chatBody"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." maxlength="60">
                    <button class="btn" id="btnSendChat">GỬI</button>
                </div>
            </div>
        </div>

        <!-- POPUP CÀI ĐẶT -->
        <div class="overlay" id="settingsOverlay">
            <div class="panel setting-box">
                <div style="font-family:'Orbitron'; color:var(--gold); font-size:16px; text-align:center;">CÀI ĐẶT GAME</div>
                
                <div class="set-row">
                    <label>Độ thu phóng (Camera):</label>
                    <input type="range" id="setZoom" min="0.3" max="1.5" step="0.05" value="0.8">
                </div>
                <div class="set-row">
                    <label>Âm thanh Tổng:</label>
                    <input type="range" id="setVolume" min="0" max="1" step="0.1" value="0.8">
                </div>
                <div class="set-row">
                    <label>Đồ họa (Độ nét):</label>
                    <select id="setGraphics">
                        <option value="1">Tiêu chuẩn (1x)</option>
                        <option value="1.5" selected>nét (1.5x)</option>
                        <option value="2">Siêu nét</option>
                    </select>
                </div>
                <div class="set-row">
                    <label>Độ mờ HUD:</label>
                    <input type="range" id="setHudAlpha" min="0.2" max="1" step="0.1" value="0.9">
                </div>

                <button class="btn" id="btnEditHUD" style="border-color:var(--gold); color:var(--gold);">CHỈNH VỊ TRÍ & CỠ HUD</button>
                <button class="btn danger" id="btnLeaveMap">RỜI MAP VỀ SẢNH</button>
                <button class="btn gold" id="btnCloseSettings">LƯU & ĐÓNG</button>
            </div>
        </div>
    </div>

    <div id="errBox" style="display:none; position:fixed; inset:0; z-index:9999; background:#1a0000; color:#ff5555; padding:16px; font-family:monospace; font-size:13px; overflow:auto; white-space:pre-wrap;"></div>
    <script src="map 1.js"></script>
<script src="map 2.js"></script>

<script>
    window.addEventListener('error', function (e) {
            const box = document.getElementById('errBox');
            box.style.display = 'block';
            box.textContent += 'LỖI: ' + e.message + '\n   Tại dòng: ' + e.lineno + ':' + e.colno + '\n\n';
        });

        // --- ÂM THANH CLICK KIỂU CÔNG NGHỆ CHO CÁC NÚT ---
        function playClickSound() {
            try {
                const ctx = window.__audioCtx || (window.__audioCtx = new (window.AudioContext || window.webkitAudioContext)());
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(1400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.07);
                gain.gain.value = 0.05;
                osc.connect(gain).connect(ctx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.09);
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }
        document.addEventListener('click', (e) => {
            if (e.target.closest && e.target.closest('.btn, .map-card')) playClickSound();
        });

        // --- 1. DISCORD OAUTH2 ---
        const CLIENT_ID = '1534238453871673414'; 
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        let currentUser = null;
        let isEditHUD = false;

        function checkDiscordAuth() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                })
                .then(res => res.json())
                .then(user => {
                    if (user.id) {
                        currentUser = user;
                        localStorage.setItem('vmi_discord_user', JSON.stringify(user));
                        window.history.replaceState({}, document.title, window.location.pathname);
                        updateUserUI();
                    }
                });
            } else {
                const saved = localStorage.getItem('vmi_discord_user');
                if (saved) { currentUser = JSON.parse(saved); updateUserUI(); }
            }
        }

        function updateUserUI() {
            if (currentUser) {
                const avUrl = currentUser.avatar 
                    ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=256`
                    : `https://cdn.discordapp.com/embed/avatars/0.png`;
                document.getElementById('avatarEl').innerHTML = `<img src="${avUrl}">`;
                document.getElementById('playerNameEl').textContent = currentUser.global_name || currentUser.username;
                document.getElementById('statusEl').textContent = '● Đã xác minh';
                document.getElementById('statusEl').style.color = 'var(--green)';
                document.getElementById('btnLogin').style.display = 'none';
                document.getElementById('btnLogout').style.display = 'block';
                document.getElementById('btnEnterGame').disabled = false;
            }
        }

        document.getElementById('btnLogin').onclick = () => {
            const url = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=identify`;
            window.location.href = url;
        };

        document.getElementById('btnLogout').onclick = () => {
            localStorage.removeItem('vmi_discord_user');
            location.reload();
        };

        // --- 2. SẢNH MAP ---
        const MAPS = [
            { id: 'm1', name: 'KHU HUẤN LUYỆN' },
            { id: 'm2', name: 'DIỄU BINH' },
            { id: 'm3', name: 'THAO TRƯỜNG' },
            { id: 'm4', name: 'SỰ KIỆN' }
        ];
        let selectedMap = MAPS[0];

        const mapRow = document.getElementById('mapRow');
        MAPS.forEach(m => {
            const card = document.createElement('div');
            card.className = 'map-card' + (m.id === selectedMap.id ? ' selected' : '');
            card.innerHTML = `<div style="font-weight:bold; font-size:12px;">${m.name}</div>`;
            card.onclick = () => {
                document.querySelectorAll('.map-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedMap = m;
                document.getElementById('mapLabel').textContent = m.name;
            };
            mapRow.appendChild(card);
        });

        function createGame() {
    // Lưu Phaser Scene hiện tại
    scene = this;

    // ==============================
    // CHỌN MAP
    // ==============================

    if (selectedMap.id === 'm1') {

        // MAP 1 - KHU HUẤN LUYỆN
        createMap1(this);

    } else if (selectedMap.id === 'm2') {

        // MAP 2 - DIỄU BINH
        createMap2(this);

    } else {

        // Các map chưa làm
        // Tạm thời dùng Map 1
        createMap1(this);
    }
        }

        function preloadScene() {
            scene = this;
            if (scene.textures.exists('p_avatar')) scene.textures.remove('p_avatar');

            const avUrl = currentUser && currentUser.avatar 
                ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=256`
                : `https://cdn.discordapp.com/embed/avatars/0.png`;

            scene.load.image('p_avatar', avUrl);
            scene.load.image('flag_vn', 'https://flagcdn.com/h240/vn.png');
            scene.load.image('tank_t90', 'https://commons.wikimedia.org/wiki/Special:FilePath/T-90_tank.svg?width=300');
            scene.load.image('btr_apc', 'https://commons.wikimedia.org/wiki/Special:FilePath/BTR-4 silhouette.png?width=300');
        }

        
            const commanderPx = padBaseX + (padCols - (padCols - 1) / 2) * cellSize; // Ngay sau ô cuối hàng 1
            const commanderPy = padBaseY + (commanderRow - (padRows - 1) / 2) * cellSize;
            scene.add.rectangle(commanderPx, commanderPy, 32, 32, 0xda251d, 0.95).setStrokeStyle(2, 0xffd700);
            scene.add.text(commanderPx, commanderPy - 28, 'CHỈ HUY', {
                font: 'bold 11px Orbitron', fill: '#ffd700', stroke: '#000000', strokeThickness: 3
            }).setOrigin(0.5);

            // 4. KHỞI TẠO PLAYER (AVATAR ẢNH THẬT)
            const playerAvatar = scene.add.image(0, 0, 'p_avatar').setDisplaySize(40, 40);
            const playerRing = scene.add.circle(0, 0, 22, 0xffffff, 0).setStrokeStyle(3, 0xffffff);

            const nameText = scene.add.text(0, -38, currentUser ? (currentUser.global_name || currentUser.username) : 'Player', {
                font: 'bold 14px Rajdhani', fill: '#ffffff', stroke: '#000000', strokeThickness: 4
            }).setOrigin(0.5);

            speechBubble = scene.add.container(0, -75).setVisible(false);
            const bubbleBg = scene.add.graphics();
            const bubbleText = scene.add.text(0, 0, '', {
                font: '600 13px Rajdhani', fill: '#000000', align: 'center', wordWrap: { width: 180 }
            }).setOrigin(0.5);
            speechBubble.add([bubbleBg, bubbleText]);
            speechBubble.bubbleBg = bubbleBg;
            speechBubble.bubbleText = bubbleText;

            // Spawn phía dưới khối pad
            playerContainer = scene.add.container(startPos, padBaseY + padHeight / 2 + 200, [playerAvatar, playerRing, nameText, speechBubble]);
            controlledObject = playerContainer;

            scene.physics.world.enable(playerContainer);
            playerContainer.body.setCollideWorldBounds(true);
            scene.physics.add.collider(playerContainer, obstacles);

            const cam = scene.cameras.main;
            cam.startFollow(playerContainer, true, 0.1, 0.1);
            cam.setBounds(0, 0, MAP_SIZE, MAP_SIZE);
            cam.setZoom(parseFloat(document.getElementById('setZoom').value));
        }
        
        function initJoystick() {
            const zone = document.getElementById('joystick-zone');
            zone.innerHTML = '';
            joystick = nipplejs.create({
                zone: zone, mode: 'static',
                position: { left: '60px', top: '60px' },
                size: 100, color: '#00e5ff'
            });

            joystick.on('move', (evt, data) => {
                if (!isEditHUD && data && data.vector) {
                    moveVector = { x: data.vector.x, y: -data.vector.y };
                }
            });
            joystick.on('end', () => { moveVector = { x: 0, y: 0 }; });
        }

        // --- 4. CÀI ĐẶT & HUD ---
        const settingsOverlay = document.getElementById('settingsOverlay');
        document.getElementById('btnOpenSettings').onclick = () => settingsOverlay.classList.add('open');
        
        document.getElementById('btnCloseSettings').onclick = () => {
            settingsOverlay.classList.remove('open');
            if (isEditHUD) toggleEditHUD(false);

            if (scene) scene.cameras.main.setZoom(parseFloat(document.getElementById('setZoom').value));
            document.documentElement.style.setProperty('--hud-alpha', document.getElementById('setHudAlpha').value);
        };

        document.getElementById('btnToggleChat').onclick = () => {
            if (!isEditHUD) document.getElementById('chatPanel').classList.toggle('hidden-chat');
        };

        document.getElementById('btnSendChat').onclick = () => {
            const input = document.getElementById('chatInput');
            const val = input.value.trim();
            if (!val) return;

            const item = document.createElement('div');
            item.innerHTML = `<b style="color:var(--cyan);">${currentUser ? currentUser.username : 'Khách'}:</b> ${val}`;
            document.getElementById('chatBody').appendChild(item);

            showRobloxBubbleChat(val);
            input.value = '';
        };

        document.getElementById('btnLeaveMap').onclick = () => {
            settingsOverlay.classList.remove('open');
            if (game) { game.destroy(true); game = null; }
            document.getElementById('screen-game').classList.remove('active');
            document.getElementById('screen-menu').style.display = 'flex';
        };

        document.getElementById('btnEditHUD').onclick = () => {
            settingsOverlay.classList.remove('open');
            toggleEditHUD(true);
        };

        function toggleEditHUD(enable) {
            isEditHUD = enable;
            const app = document.getElementById('app');
            if (enable) {
                app.classList.add('edit-hud-mode');
                makeDraggable(document.getElementById('chatPanel'));
                makeDraggable(document.getElementById('joystick-zone'));
            } else {
                app.classList.remove('edit-hud-mode');
            }
        }

        function makeDraggable(el) {
            let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
            el.onmousedown = dragMouseDown;
            el.ontouchstart = dragMouseDown;

            function dragMouseDown(e) {
                if (!isEditHUD) return;
                e = e || window.event;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                p3 = clientX; p4 = clientY;
                document.onmouseup = closeDragElement;
                document.ontouchend = closeDragElement;
                document.onmousemove = elementDrag;
                document.ontouchmove = elementDrag;
            }

            function elementDrag(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                p1 = p3 - clientX; p2 = p4 - clientY;
                p3 = clientX; p4 = clientY;
                el.style.top = (el.offsetTop - p2) + "px";
                el.style.left = (el.offsetLeft - p1) + "px";
                el.style.bottom = 'auto'; el.style.right = 'auto';
            }

            function closeDragElement() {
                document.onmouseup = null; document.onmousemove = null;
                document.ontouchend = null; document.ontouchmove = null;
            }
        }

        function updateScene() {
            if (!playerContainer || !playerContainer.body) return;
            const speed = 220;
            playerContainer.body.setVelocity(moveVector.x * speed, moveVector.y * speed);
        }

        function showRobloxBubbleChat(text) {
            if (!speechBubble) return;
            speechBubble.bubbleText.setText(text);
            const w = speechBubble.bubbleText.width + 20;
            const h = speechBubble.bubbleText.height + 14;
            speechBubble.bubbleBg.clear();
            speechBubble.bubbleBg.fillStyle(0xffffff, 1);
            speechBubble.bubbleBg.fillRoundedRect(-w / 2, -h / 2, w, h, 8);
            speechBubble.setVisible(true);
            clearTimeout(speechBubble._t);
            speechBubble._t = setTimeout(() => speechBubble.setVisible(false), 3000);
        }

        window.onload = checkDiscordAuth;
        window.onresize = () => { if (game) game.scale.resize(window.innerWidth, window.innerHeight); };
    </script>
</body>
</html>
