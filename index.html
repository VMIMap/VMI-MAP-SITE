<style>

/* ==========================================================
   RESET
========================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    user-select: none;
    -webkit-user-select: none;

    -webkit-tap-highlight-color: transparent;
}

html,
body {

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #0b0e14;

    font-family: Rajdhani, sans-serif;

    color: #e7edff;
}

/* ==========================================================
   BIẾN
========================================================== */

:root {

    --bg: #0b0e14;

    --panel: rgba(16,22,34,.94);

    --line: rgba(0,229,255,.4);

    --cyan: #00e5ff;

    --gold: #e8b84b;

    --red: #ff3b3b;

    --green: #39ff88;

    --text: #e7edff;

    --hud-alpha: .9;
}

/* ==========================================================
   PANEL
========================================================== */

.panel {

    background: var(--panel);

    border: 1px solid var(--line);

    backdrop-filter: blur(8px);
}

/* ==========================================================
   BUTTON
========================================================== */

.btn {

    font-family: Orbitron, sans-serif;

    font-size: 12px;

    color: #fff;

    background: rgba(0,229,255,.1);

    border: 1px solid var(--cyan);

    padding: 10px 16px;

    cursor: pointer;

    text-align: center;

    font-weight: bold;

    transition: .2s;

    touch-action: manipulation;
}

.btn:hover {

    background:
        rgba(0,229,255,.25);
}

.btn:active {

    transform: scale(.96);
}

.btn.gold {

    border-color: var(--gold);

    background: var(--gold);

    color: #000;
}

.btn.gold:hover {

    background: #f0c85a;
}

.btn.danger {

    border-color: var(--red);

    background:
        rgba(255,59,59,.2);
}

.btn.danger:hover {

    background:
        rgba(255,59,59,.4);
}

.btn:disabled {

    opacity: .3;

    cursor: not-allowed;
}

/* ==========================================================
   SẢNH
========================================================== */

#screen-menu {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    z-index: 10;

    padding: 15px;

    background:
        radial-gradient(
            circle,
            #1a2333 0%,
            #0b0e14 100%
        );
}

.lobby-box {

    width: 100%;

    max-width: 500px;

    display: flex;

    flex-direction: column;

    gap: 15px;

    align-items: center;
}

.title {

    font-family: Orbitron, sans-serif;

    font-size: 28px;

    color: var(--gold);

    text-shadow:
        0 0 10px var(--gold);
}

/* ==========================================================
   PROFILE
========================================================== */

.profile-card {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 10px 20px;

    width: 100%;

    max-width: 400px;
}

.avatar {

    width: 48px;

    height: 48px;

    min-width: 48px;

    border-radius: 50%;

    border: 2px solid var(--cyan);

    overflow: hidden;

    background: #000;

    flex-shrink: 0;
}

.avatar img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;

    border-radius: 50%;
}

/* ==========================================================
   GAME
========================================================== */

#screen-game {

    position: absolute;

    inset: 0;

    display: none;

    z-index: 5;

    background: #000;
}

#screen-game.active {

    display: block;
}

#phaser-container {

    width: 100%;

    height: 100%;

    position: absolute;

    inset: 0;
}

/* ==========================================================
   HUD
========================================================== */

.hud-element {

    position: absolute;

    z-index: 200;

    opacity: var(--hud-alpha);
}

.hud-top {

    top: 10px;

    right: 10px;

    display: flex;

    gap: 8px;

    pointer-events: none;
}

.hud-top > * {

    pointer-events: auto;
}

/* ==========================================================
   JOYSTICK
========================================================== */

#joystick-zone {

    position: fixed;

    bottom: 20px;

    left: 20px;

    width: 120px;

    height: 120px;

    z-index: 300;

    touch-action: none;

    pointer-events: auto;
}

/* ==========================================================
   CHAT BUTTON
========================================================== */

#chat-toggle {

    position: fixed;

    top: 70px;

    left: 15px;

    z-index: 500;

    width: 50px;

    height: 50px;

    border-radius: 50%;

    background:
        rgba(11,14,20,.95);

    border: 2px solid var(--cyan);

    color: var(--cyan);

    font-size: 22px;

    display: none;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    box-shadow:
        0 0 15px
        rgba(0,229,255,.35);

    touch-action: manipulation;
}

#chat-toggle:hover {

    transform: scale(1.08);
}

/* ==========================================================
   CHAT WINDOW
========================================================== */

#chat-window {

    position: fixed;

    top: 130px;

    left: 15px;

    width: 290px;

    height: 330px;

    background:
        rgba(11,14,20,.97);

    border: 1px solid var(--cyan);

    border-radius: 12px;

    backdrop-filter: blur(10px);

    display: none;

    flex-direction: column;

    z-index: 600;

    box-shadow:
        0 0 30px
        rgba(0,0,0,.8);

    overflow: hidden;
}

#chat-window.open {

    display: flex;
}

/* ==========================================================
   CHAT HEADER
========================================================== */

.chat-header {

    flex: 0 0 35px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 6px 12px;

    background:
        rgba(0,229,255,.1);

    border-bottom:
        1px solid var(--line);

    font-family: Orbitron;

    font-size: 12px;

    color: var(--gold);
}

.chat-header .close-btn {

    background: none;

    border: none;

    color: var(--red);

    font-size: 18px;

    cursor: pointer;

    padding: 3px 6px;
}

/* ==========================================================
   CHAT MESSAGES
========================================================== */

.chat-messages {

    flex: 1;

    min-height: 0;

    padding: 8px 10px;

    overflow-y: auto;

    overflow-x: hidden;

    font-size: 13px;

    line-height: 1.4;

    display: flex;

    flex-direction: column;

    gap: 3px;

    scrollbar-width: thin;

    touch-action: pan-y;

    overscroll-behavior:
        contain;
}

.chat-messages::-webkit-scrollbar {

    width: 5px;
}

.chat-messages::-webkit-scrollbar-thumb {

    background:
        var(--cyan);

    border-radius: 10px;
}

.chat-messages .msg {

    padding: 3px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.05);

    word-break: break-word;

    flex-shrink: 0;
}

.chat-messages .msg.system {

    color: var(--gold);

    font-style: italic;
}

.chat-messages .msg.user {

    color: var(--text);
}

.chat-messages .msg .name {

    color: var(--cyan);

    font-weight: bold;
}

/* ==========================================================
   CHAT INPUT
========================================================== */

.chat-input-area {

    flex: 0 0 43px;

    display: flex;

    align-items: center;

    padding: 5px 6px;

    border-top:
        1px solid var(--line);

    gap: 5px;

    background:
        rgba(0,0,0,.7);

    z-index: 5;

    pointer-events: auto;
}

.chat-input-area input {

    flex: 1;

    min-width: 0;

    height: 32px;

    background:
        rgba(0,0,0,.5);

    border:
        1px solid var(--line);

    border-radius: 6px;

    padding: 5px 8px;

    color: #fff;

    font-family: Rajdhani;

    font-size: 14px;

    outline: none;

    user-select: text;

    -webkit-user-select: text;

    touch-action: auto;
}

.chat-input-area input:focus {

    border-color:
        var(--cyan);
}

.chat-input-area button {

    flex: 0 0 55px;

    height: 32px;

    background:
        var(--cyan);

    border: none;

    border-radius: 6px;

    color: #000;

    font-weight: bold;

    cursor: pointer;

    font-family: Orbitron;

    font-size: 10px;

    touch-action: manipulation;
}

/* ==========================================================
   SETTINGS
========================================================== */

.overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.85);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 1000;
}

.overlay.open {

    display: flex;
}

.setting-box {

    width: 90%;

    max-width: 420px;

    padding: 20px;

    display: flex;

    flex-direction: column;

    gap: 12px;

    max-height: 90vh;

    overflow-y: auto;
}

.set-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 13px;
}

.set-row input[type=range],
.set-row select {

    width: 50%;
}

/* ==========================================================
   EDIT HUD
========================================================== */

.edit-hud-mode
.hud-element {

    border:
        2px dashed
        var(--gold) !important;

    cursor: move;
}

/* ==========================================================
   ERROR
========================================================== */

#errBox {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 99999;

    background: #1a0000;

    color: #ff5555;

    padding: 16px;

    font-family: monospace;

    font-size: 13px;

    overflow: auto;

    white-space: pre-wrap;
}

/* ==========================================================
   MOBILE
========================================================== */

@media (max-width: 600px) {

    #chat-window {

        width: min(
            290px,
            calc(100vw - 30px)
        );

        height: 330px;
    }

    #chat-toggle {

        top: 65px;

        left: 12px;
    }

    .hud-top {

        top: 10px;

        right: 10px;
    }
}

</style>
</head>

     MAP 2 – BẠN PHẢI CÓ FILE NÀY

<script src="map2.js"></script>

<script>
/* ==========================================================
   TOÀN BỘ JAVASCRIPT ĐÃ SỬA – KHÔNG TRÙNG LẶP
========================================================== */

/* BẮT LỖI */
window.addEventListener('error', function(e) {
    const box = document.getElementById('errBox');
    if (!box) return;
    box.style.display = 'block';
    box.textContent += 'LỖI: ' + e.message + '\nTại dòng: ' + e.lineno + ':' + e.colno + '\n\n';
});

/* BIẾN CHÍNH */
let currentUser = null;
let isEditHUD = false;
let scene = null;
let game = null;
let joystick = null;
let moveVector = { x: 0, y: 0 };
let playerContainer = null;
let controlledObject = null;
let playerBody = null;
let speechBubble = null;
let speechBubbleTimer = null;
let socket = null;
let otherPlayers = {};
let lastNetworkSend = 0;
const MAP_SIZE = 3000;

/* CHAT ELEMENT */
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const chatToggle = document.getElementById('chat-toggle');
const chatWindow = document.getElementById('chat-window');
const chatClose = document.getElementById('chat-close');
const chatSend = document.getElementById('chat-send');

/* CHAT MỞ / ĐÓNG */
function toggleChat(force) {
    if (typeof force === 'boolean') {
        chatWindow.classList.toggle('open', force);
    } else {
        chatWindow.classList.toggle('open');
    }
}
chatToggle.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    toggleChat();
});
chatClose.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    toggleChat(false);
});

/* BUBBLE CHO PLAYER CỦA MÌNH */
function showBubbleOnPlayer(text, duration = 3000) {
    if (!speechBubble) return;
    const bg = speechBubble.bubbleBg;
    const txt = speechBubble.bubbleText;
    if (!bg || !txt) return;
    txt.setText(text);
    const padding = 12;
    const maxWidth = 220;
    let w = Math.min((txt.width || 60) + padding * 2, maxWidth);
    let h = Math.max(34, (txt.height || 20) + 14);
    bg.clear();
    bg.fillStyle(0xffffff, 0.96);
    bg.fillRoundedRect(-w/2, -h/2, w, h, 10);
    bg.lineStyle(2, 0x00e5ff, 1);
    bg.strokeRoundedRect(-w/2, -h/2, w, h, 10);
    txt.setOrigin(0.5, 0.5);
    txt.setPosition(0, 0);
    speechBubble.setVisible(true);
    if (speechBubbleTimer) clearTimeout(speechBubbleTimer);
    speechBubbleTimer = setTimeout(function() {
        if (speechBubble) speechBubble.setVisible(false);
        speechBubbleTimer = null;
    }, duration);
}

/* GỬI CHAT */
function sendChatMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    if (!currentUser) {
        addChatMessage('Bạn cần đăng nhập để nhắn tin.', 'system');
        chatInput.value = '';
        return;
    }
    const finalText = text.substring(0, 999);
    if (socket && socket.connected) {
        socket.emit('chatMessage', { id: currentUser.id, text: finalText });
    } else {
        const name = currentUser.global_name || currentUser.username || 'Player';
        addChatMessage(finalText, 'user', name);
        showBubbleOnPlayer(finalText, 3000);
    }
    chatInput.value = '';
    chatInput.blur();
}
chatSend.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    sendChatMessage();
});
chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
        sendChatMessage();
    }
});

/* THÊM TIN NHẮN */
function addChatMessage(text, type = 'user', name = '') {
    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg ' + type;
    if (type === 'user') {
        const nameSpan = document.createElement('span');
        nameSpan.className = 'name';
        nameSpan.textContent = name;
        msgDiv.appendChild(nameSpan);
        msgDiv.appendChild(document.createTextNode(': ' + text));
    } else {
        msgDiv.textContent = text;
    }
    chatMessages.appendChild(msgDiv);
    const distanceFromBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight;
    if (distanceFromBottom < 100) {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
}
function systemNotice(text) {
    addChatMessage(text, 'system');
}

/* DISCORD AUTH */
const CLIENT_ID = '1534238453871673414';
const REDIRECT_URI = window.location.origin + window.location.pathname;

function checkDiscordAuth() {
    const hashParams = new URLSearchParams(window.location.hash.slice(1));
    const token = hashParams.get('access_token');
    if (token) {
        fetch('https://discord.com/api/users/@me', {
            headers: { authorization: `Bearer ${token}` }
        })
        .then(r => r.json())
        .then(user => {
            if (!user.id) {
                systemNotice('Discord đăng nhập thất bại.');
                return;
            }
            currentUser = user;
            localStorage.setItem('vmi_discord_user', JSON.stringify(user));
            window.history.replaceState({}, document.title, window.location.pathname);
            updateUserUI();
            systemNotice('🔹 Đã đăng nhập thành công!');
        })
        .catch(err => console.error('Discord auth:', err));
    } else {
        const saved = localStorage.getItem('vmi_discord_user');
        if (saved) {
            try {
                currentUser = JSON.parse(saved);
                updateUserUI();
            } catch {
                localStorage.removeItem('vmi_discord_user');
            }
        }
    }
}

function updateUserUI() {
    if (!currentUser) return;
    const avatarUrl = currentUser.avatar
        ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=256`
        : 'https://cdn.discordapp.com/embed/avatars/0.png';
    const avatarImg = document.getElementById('avatarImg');
    avatarImg.src = avatarUrl;
    avatarImg.onerror = function() { avatarImg.src = 'https://cdn.discordapp.com/embed/avatars/0.png'; };
    document.getElementById('playerNameEl').textContent = currentUser.global_name || currentUser.username;
    const status = document.getElementById('statusEl');
    status.textContent = '● Đã xác minh';
    status.style.color = 'var(--green)';
    document.getElementById('btnLogin').style.display = 'none';
    document.getElementById('btnLogout').style.display = 'block';
    document.getElementById('btnEnterGame').disabled = false;
}

// ======== SỬA NÚT ĐĂNG NHẬP CHO MOBILE ========
const btnLogin = document.getElementById('btnLogin');
function doLogin() {
    console.log('🔐 Đang chuyển hướng đến Discord...');
    const url = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=identify`;
    window.location.href = url;
}
// Bắt cả click và touchstart
btnLogin.addEventListener('click', doLogin);
btnLogin.addEventListener('touchstart', doLogin);

// ======== NÚT ĐĂNG XUẤT ========
document.getElementById('btnLogout').onclick = function() {
    localStorage.removeItem('vmi_discord_user');
    location.reload();
};

/* ==========================================================
   PHASER SCENE – PRELOAD, CREATE, UPDATE
========================================================== */
function preloadScene() {
    scene = this;
    if (scene.textures.exists('p_avatar')) scene.textures.remove('p_avatar');
    const avatarUrl = currentUser && currentUser.avatar
        ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=256`
        : 'https://cdn.discordapp.com/embed/avatars/0.png';
    scene.load.image('p_avatar', avatarUrl);
    scene.load.image('flag_vn', 'https://flagcdn.com/w256/vn.png');
    scene.load.image('tank_t90', 'https://commons.wikimedia.org/wiki/Special:FilePath/T-90_tank.svg?width=300');
    scene.load.image('btr_apc', 'https://commons.wikimedia.org/wiki/Special:FilePath/BTR-4%20silhouette.png?width=300');
}

function createGame() {
    scene = this;
    playerContainer = null;
    controlledObject = null;
    speechBubble = null;
    playerBody = null;
    moveVector = { x: 0, y: 0 };
    if (typeof createMap2 === 'function') {
        createMap2(this);
    } else {
        this.add.rectangle(0, 0, MAP_SIZE, MAP_SIZE, 0x1a2333).setOrigin(0,0);
        this.add.text(MAP_SIZE/2, MAP_SIZE/2, 'MAP 2 (FALLBACK)', { color: '#ffffff', fontSize: '32px' }).setOrigin(0.5);
    }
    if (this.physics && this.physics.world) {
        this.physics.world.setBounds(0, 0, MAP_SIZE, MAP_SIZE);
    }
    ensurePlayer();
    setupJoystick();
    chatToggle.style.display = 'flex';
    chatWindow.classList.remove('open');
    const displayName = currentUser ? (currentUser.global_name || currentUser.username) : 'Khách';
    systemNotice(`👤 ${displayName} đã vào server`);
    setTimeout(startMultiplayer, 500);
}

function update(time, delta) {
    if (!scene) return;
    updateSelfMovement();
    sendPlayerPosition();
    updateOtherPlayers();
}

/* TẠO PLAYER CỦA MÌNH */
function ensurePlayer() {
    if (!scene || !scene.physics || playerContainer) return;
    const spawn = scene.map2Spawn || { x: MAP_SIZE/2, y: MAP_SIZE/2 };
    playerContainer = scene.add.container(spawn.x, spawn.y);
    playerContainer.setDepth(10000);

    const avatarBg = scene.add.circle(0, 0, 34, 0x0b0e14, 1);
    avatarBg.setStrokeStyle(3, 0x00e5ff, 1);

    let avatar;
    if (scene.textures.exists('p_avatar')) {
        avatar = scene.add.image(0, 0, 'p_avatar');
        avatar.setDisplaySize(60, 60);
        avatar.setOrigin(0.5, 0.5);
        const maskGraphics = scene.make.graphics({ x:0, y:0, add:false });
        maskGraphics.fillStyle(0xffffff);
        maskGraphics.fillCircle(0, 0, 29);
        const mask = maskGraphics.createGeometryMask();
        avatar.setMask(mask);
        avatar.avatarMaskGraphics = maskGraphics;
    } else {
        avatar = scene.add.circle(0, 0, 29, 0x00e5ff, 1);
        avatar.setStrokeStyle(2, 0xffffff, 1);
    }

    const border = scene.add.graphics();
    border.lineStyle(3, 0x00e5ff, 1);
    border.strokeCircle(0, 0, 31);

    const playerName = currentUser ? (currentUser.global_name || currentUser.username) : 'Khách';
    const nameText = scene.add.text(0, 45, playerName, {
        fontFamily: 'Rajdhani',
        fontSize: '14px',
        fontStyle: 'bold',
        color: '#ffffff',
        stroke: '#000000',
        strokeThickness: 4
    });
    nameText.setOrigin(0.5);

    playerContainer.add([avatarBg, avatar, border, nameText]);

    // Bubble chat
    const bubbleBg = scene.add.graphics();
    const bubbleText = scene.add.text(0, 0, '', {
        fontFamily: 'Rajdhani',
        fontSize: '14px',
        fontStyle: 'bold',
        color: '#000000',
        align: 'center',
        wordWrap: { width: 190 }
    });
    bubbleText.setOrigin(0.5);
    speechBubble = scene.add.container(0, -70);
    speechBubble.add([bubbleBg, bubbleText]);
    speechBubble.setVisible(false);
    speechBubble.bubbleBg = bubbleBg;
    speechBubble.bubbleText = bubbleText;
    playerContainer.add(speechBubble);

    // Physics
    playerBody = scene.physics.add.existing(playerContainer);
    controlledObject = playerContainer;
    if (playerContainer.body) {
        playerContainer.body.setCircle(28, -28, -28);
        playerContainer.body.setCollideWorldBounds(true);
        playerContainer.body.setDrag(800, 800);
    }

    if (scene.cameras && scene.cameras.main) {
        scene.cameras.main.startFollow(playerContainer, true, 0.08, 0.08);
        const zoom = parseFloat(document.getElementById('setZoom').value) || 0.8;
        scene.cameras.main.setZoom(zoom);
    }
}

/* JOYSTICK */
function setupJoystick() {
    if (joystick && joystick.destroy) joystick.destroy();
    const zone = document.getElementById('joystick-zone');
    if (!zone) return;
    zone.innerHTML = '';
    if (typeof nipplejs === 'undefined') {
        console.log('Không có nipplejs');
        return;
    }
    joystick = nipplejs.create({
        zone: zone,
        mode: 'static',
        position: { left: '60px', top: '60px' },
        color: '#00e5ff',
        size: 110,
        multitouch: true,
        restJoystick: true
    });
    joystick.on('move', function(evt, data) {
        if (!data || !data.vector) return;
        moveVector.x = data.vector.x || 0;
        moveVector.y = -(data.vector.y || 0);
    });
    joystick.on('end', function() {
        moveVector.x = 0;
        moveVector.y = 0;
    });
}

/* DI CHUYỂN CỦA MÌNH */
function updateSelfMovement() {
    if (!scene || !playerContainer || !playerContainer.body) return;
    const body = playerContainer.body;
    const speed = 180;
    let vx = moveVector.x || 0;
    let vy = moveVector.y || 0;
    if (scene.input && scene.input.keyboard) {
        if (!scene.cursors) scene.cursors = scene.input.keyboard.createCursorKeys();
        const cursors = scene.cursors;
        if (cursors.left.isDown) vx = -1;
        if (cursors.right.isDown) vx = 1;
        if (cursors.up.isDown) vy = -1;
        if (cursors.down.isDown) vy = 1;
    }
    const length = Math.sqrt(vx*vx + vy*vy);
    if (length > 1) { vx /= length; vy /= length; }
    body.setVelocity(vx * speed, vy * speed);
}

/* MULTIPLAYER – KẾT NỐI SERVER */
const SERVER_URL = 'https://vmi-map-site.onrender.com';

function startMultiplayer() {
    if (socket && socket.connected) return;
    if (typeof io === 'undefined') {
        systemNotice('Không tìm thấy Socket.IO.');
        console.error('Socket.IO chưa được load.');
        return;
    }
    socket = io(SERVER_URL, {
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000
    });

    socket.on('connect', function() {
        console.log('Socket connected:', socket.id);
        const name = currentUser ? (currentUser.global_name || currentUser.username) : 'Khách';
        socket.emit('playerJoin', {
            id: currentUser ? currentUser.id : socket.id,
            name: name,
            avatar: currentUser && currentUser.avatar
                ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=128`
                : 'https://cdn.discordapp.com/embed/avatars/0.png'
        });
        systemNotice('Đã kết nối server.');
    });

    socket.on('disconnect', function() {
        console.log('Socket disconnected');
        systemNotice('Mất kết nối server.');
    });

    socket.on('chatMessage', function(data) {
        if (!data) return;
        const name = data.name || 'Player';
        const text = data.text || '';
        if (!text) return;
        addChatMessage(text, 'user', name);
        const playerId = data.id;
        if (currentUser && playerId === currentUser.id) {
            showBubbleOnPlayer(text, 3000);
        } else {
            showPlayerBubble(playerId, text);
        }
    });

    socket.on('playerJoined', function(data) {
        if (!data) return;
        if (currentUser && data.id === currentUser.id) return;
        createOtherPlayer(data);
    });

    socket.on('players', function(players) {
        if (!players) return;
        Object.keys(players).forEach(function(id) {
            if (currentUser && id === currentUser.id) return;
            createOtherPlayer(players[id]);
        });
    });

    socket.on('playerMoved', function(data) {
        if (!data) return;
        const other = otherPlayers[data.id];
        if (!other || !other.container) return;
        other.targetX = Number(data.x) || 0;
        other.targetY = Number(data.y) || 0;
    });

    socket.on('playerLeft', function(id) {
        removeOtherPlayer(id);
    });
}

/* GỬI VỊ TRÍ LÊN SERVER */
let lastSentX = null, lastSentY = null, lastSentTime = 0;
function sendPlayerPosition() {
    if (!socket || !socket.connected || !currentUser || !playerContainer) return;
    const now = performance.now();
    if (now - lastSentTime < 50) return;
    const x = playerContainer.x;
    const y = playerContainer.y;
    if (lastSentX === x && lastSentY === y) return;
    lastSentX = x;
    lastSentY = y;
    lastSentTime = now;
    socket.emit('playerMove', { id: currentUser.id, x: x, y: y });
}

/* PLAYER KHÁC – TẠO, CẬP NHẬT, XÓA */
function createOtherPlayer(data) {
    if (!scene || !scene.add || !data || !data.id) return;
    if (otherPlayers[data.id]) return;
    const x = Number(data.x) || scene.map2Spawn?.x || MAP_SIZE/2;
    const y = Number(data.y) || scene.map2Spawn?.y || MAP_SIZE/2;
    const container = scene.add.container(x, y);
    container.setDepth(9999);

    const bg = scene.add.circle(0, 0, 34, 0x111111, 0.95);
    bg.setStrokeStyle(3, 0xffd700, 1);

    let avatar;
    const textureKey = 'other_' + data.id;
    if (data.avatar) {
        if (!scene.textures.exists(textureKey)) {
            scene.load.image(textureKey, data.avatar);
            scene.load.once('complete', function() {
                if (container && container.active && scene.textures.exists(textureKey)) {
                    createOtherAvatar(container, textureKey);
                }
            });
            scene.load.start();
        }
    }
    if (scene.textures.exists(textureKey)) {
        avatar = createOtherAvatar(container, textureKey);
    } else {
        avatar = scene.add.circle(0, 0, 29, 0xff4444, 1);
    }

    const name = data.name || 'Player';
    const nameText = scene.add.text(0, 45, name, {
        fontFamily: 'Rajdhani',
        fontSize: '14px',
        fontStyle: 'bold',
        color: '#ffffff',
        stroke: '#000000',
        strokeThickness: 4
    });
    nameText.setOrigin(0.5);

    container.add([bg, avatar, nameText]);

    // Bubble cho player khác
    const bubbleBg = scene.add.graphics();
    const bubbleText = scene.add.text(0, 0, '', {
        fontFamily: 'Rajdhani',
        fontSize: '14px',
        fontStyle: 'bold',
        color: '#000000',
        align: 'center',
        wordWrap: { width: 190 }
    });
    bubbleText.setOrigin(0.5);
    const bubble = scene.add.container(0, -70);
    bubble.add([bubbleBg, bubbleText]);
    bubble.setVisible(false);
    bubble.bubbleBg = bubbleBg;
    bubble.bubbleText = bubbleText;
    container.add(bubble);

    otherPlayers[data.id] = {
        id: data.id,
        name: name,
        container: container,
        bubble: bubble,
        targetX: x,
        targetY: y,
        bubbleTimer: null
    };
}

function createOtherAvatar(container, textureKey) {
    if (!scene || !scene.textures.exists(textureKey)) {
        return scene.add.circle(0, 0, 29, 0xff4444);
    }
    const avatar = scene.add.image(0, 0, textureKey);
    avatar.setDisplaySize(60, 60);
    avatar.setOrigin(0.5);
    const maskGraphics = scene.make.graphics({ x:0, y:0, add:false });
    maskGraphics.fillStyle(0xffffff);
    maskGraphics.fillCircle(0, 0, 29);
    const mask = maskGraphics.createGeometryMask();
    avatar.setMask(mask);
    container.add(avatar);
    return avatar;
}

function showPlayerBubble(playerId, text, duration = 3000) {
    const other = otherPlayers[playerId];
    if (!other || !other.bubble) return;
    const bg = other.bubble.bubbleBg;
    const txt = other.bubble.bubbleText;
    if (!bg || !txt) return;
    txt.setText(text);
    const padding = 10;
    const maxWidth = 220;
    let w = Math.min((txt.width || 60) + padding * 2, maxWidth);
    let h = Math.max(34, (txt.height || 20) + 14);
    bg.clear();
    bg.fillStyle(0xffffff, 0.95);
    bg.fillRoundedRect(-w/2, -h/2, w, h, 10);
    bg.lineStyle(2, 0x00e5ff, 1);
    bg.strokeRoundedRect(-w/2, -h/2, w, h, 10);
    txt.setPosition(0, 0);
    other.bubble.setVisible(true);
    if (other.bubbleTimer) clearTimeout(other.bubbleTimer);
    other.bubbleTimer = setTimeout(function() {
        if (other.bubble && other.bubble.active) {
            other.bubble.setVisible(false);
        }
        other.bubbleTimer = null;
    }, duration);
}

function removeOtherPlayer(id) {
    const other = otherPlayers[id];
    if (!other) return;
    if (other.bubbleTimer) clearTimeout(other.bubbleTimer);
    if (other.container) other.container.destroy(true);
    delete otherPlayers[id];
}

function updateOtherPlayers() {
    Object.keys(otherPlayers).forEach(function(id) {
        const other = otherPlayers[id];
        if (!other || !other.container) return;
        const targetX = Number(other.targetX);
        const targetY = Number(other.targetY);
        if (Number.isFinite(targetX)) {
            other.container.x += (targetX - other.container.x) * 0.25;
        }
        if (Number.isFinite(targetY)) {
            other.container.y += (targetY - other.container.y) * 0.25;
        }
    });
}

/* KHỞI TẠO PHASER GAME */
function initPhaser() {
    if (game) return;
    const config = {
        type: Phaser.AUTO,
        width: window.innerWidth,
        height: window.innerHeight,
        parent: 'phaser-container',
        physics: {
            default: 'arcade',
            arcade: { debug: false }
        },
        scene: {
            preload: preloadScene,
            create: createGame,
            update: update
        }
    };
    game = new Phaser.Game(config);
}

/* SỰ KIỆN ONLOAD */
window.onload = function() {
    checkDiscordAuth();
    setTimeout(initPhaser, 300);
};

/* RESIZE */
window.addEventListener('resize', function() {
    if (game && game.scale) {
        game.scale.resize(window.innerWidth, window.innerHeight);
    }
});

/* CÁC NÚT HUD */
document.getElementById('btnEnterGame').addEventListener('click', function() {
    if (!currentUser) {
        systemNotice('Vui lòng đăng nhập trước.');
        return;
    }
    document.getElementById('screen-menu').style.display = 'none';
    document.getElementById('screen-game').classList.add('active');
    if (!game) initPhaser();
});

document.getElementById('btnLeaveMap').addEventListener('click', function() {
    document.getElementById('screen-game').classList.remove('active');
    document.getElementById('screen-menu').style.display = 'flex';
    if (socket && socket.connected) socket.disconnect();
    Object.keys(otherPlayers).forEach(function(id) {
        removeOtherPlayer(id);
    });
});

document.getElementById('btnOpenSettings').addEventListener('click', function() {
    document.getElementById('settingsOverlay').classList.add('open');
});

document.getElementById('btnCloseSettings').addEventListener('click', function() {
    document.getElementById('settingsOverlay').classList.remove('open');
    if (scene && scene.cameras && scene.cameras.main) {
        const zoom = parseFloat(document.getElementById('setZoom').value) || 0.8;
        scene.cameras.main.setZoom(zoom);
    }
    const alpha = parseFloat(document.getElementById('setHudAlpha').value) || 0.9;
    document.querySelectorAll('.hud-element').forEach(el => {
        el.style.opacity = alpha;
    });
});

document.getElementById('settingsOverlay').addEventListener('click', function(e) {
    if (e.target === this) {
        this.classList.remove('open');
    }
});

/* CHỈNH HUD */
document.getElementById('btnEditHUD').addEventListener('click', function() {
    document.body.classList.toggle('edit-hud-mode');
    isEditHUD = !isEditHUD;
    this.textContent = isEditHUD ? 'DỪNG CHỈNH' : 'CHỈNH VỊ TRÍ HUD';
});

console.log('VMI MAP loaded successfully.');
