<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SERVER GAME VMI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />

    <!-- ==================== PHẦN 2: CSS ==================== -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        :root {
            --bg: #0b0e14;
            --panel: rgba(16, 22, 34, 0.9);
            --line: rgba(0, 229, 255, 0.4);
            --cyan: #00e5ff;
            --gold: #e8b84b;
            --red: #ff3b3b;
            --green: #39ff88;
            --text: #e7edff;
            --hud-alpha: 0.9;
        }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); font-family: 'Rajdhani', sans-serif; color: var(--text); }

        .panel { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(8px); }
        .btn {
            font-family: 'Orbitron', sans-serif; font-size: 12px; color: #fff; background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--cyan); padding: 10px 16px; cursor: pointer; text-align: center; font-weight: bold;
        }
        .btn.gold { border-color: var(--gold); background: var(--gold); color: #000; }
        .btn.danger { border-color: var(--red); background: rgba(255, 59, 59, 0.2); color: #fff; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        #screen-menu {
            position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10; padding: 15px; background: radial-gradient(circle, #1a2333 0%, #0b0e14 100%);
        }
        .lobby-box { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .title { font-family: 'Orbitron', sans-serif; font-size: 28px; color: var(--gold); text-shadow: 0 0 10px var(--gold); }

        .profile-card { display: flex; align-items: center; gap: 12px; padding: 10px 20px; width: 100%; max-width: 400px; justify-content: center; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--cyan); overflow: hidden; background: #000; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .map-row { display: flex; flex-direction: row; gap: 10px; width: 100%; overflow-x: auto; padding: 5px; justify-content: center; }
        .map-card {
            flex: 1; min-width: 120px; max-width: 160px; height: 70px; padding: 10px; cursor: pointer;
            border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.03); transition: 0.2s;
        }
        .map-card.selected { border-color: var(--green); background: rgba(57, 255, 136, 0.15); transform: scale(1.05); }

        #screen-game { position: absolute; inset: 0; display: none; z-index: 5; background: #000; }
        #screen-game.active { display: block; }
        #phaser-container { width: 100%; height: 100%; }

        .hud-element { position: absolute; z-index: 20; opacity: var(--hud-alpha); }
        .hud-top { top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
        .hud-top > * { pointer-events: auto; }

        #joystick-zone { bottom: 20px; left: 20px; width: 120px; height: 120px; }

        #chatPanel {
            bottom: 20px; right: 20px; width: 260px; height: 160px; display: flex; flex-direction: column;
            background: var(--panel); border: 1px solid var(--line); transition: opacity 0.2s;
        }
        #chatPanel.hidden-chat { display: none !important; }
        .chat-body { flex: 1; overflow-y: auto; padding: 5px; font-size: 11px; display: flex; flex-direction: column; gap: 3px; }
        .chat-input { display: flex; border-top: 1px solid var(--line); }
        .chat-input input { flex: 1; background: transparent; border: none; color: #fff; padding: 5px; font-size: 11px; outline: none; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
        .overlay.open { display: flex; }
        .setting-box { width: 90%; max-width: 420px; padding: 20px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; }
        .set-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .set-row input[type=range], .set-row select { width: 50%; }

        .edit-hud-mode .hud-element { border: 2px dashed var(--gold) !important; cursor: move; }
    </style>
</head>
<body>
    <div id="app">
        <!-- ==================== PHẦN 1: HTML ==================== -->
        <!-- SẢNH GAME (LOBBY) -->
        <div id="screen-menu">
            <div class="lobby-box">
                <div class="title">VMI MILITARY</div>

                <div class="panel profile-card">
                    <div class="avatar" id="avatarEl"><img src="https://cdn.discordapp.com/embed/avatars/0.png"></div>
                    <div style="flex:1;">
                        <div id="playerNameEl" style="font-weight:bold;">Chưa đăng nhập</div>
                        <div id="statusEl" style="font-size:10px; color:var(--red);">Khách</div>
                    </div>
                    <button class="btn" id="btnLogin">DISCORD</button>
                    <button class="btn danger" id="btnLogout" style="display:none;">THOÁT</button>
                </div>

                <div style="font-size:12px; color:var(--cyan);">CHỌN BẢN ĐỒ HUẤN LUYỆN</div>
                <div class="map-row" id="mapRow"></div>

                <button id="btnEnterGame" class="btn gold" style="width:200px; height:45px;" disabled>VÀO GAME</button>
            </div>
        </div>

        <!-- MAN HINH GAME -->
        <div id="screen-game">
            <div id="phaser-container"></div>

            <div class="hud-top hud-element">
                <div class="panel" style="padding:6px 12px; color:var(--gold); font-weight:bold;" id="mapLabel">KHU HUẤN LUYỆN</div>
                <div style="display:flex; gap:8px;">
                    <button class="btn" id="btnToggleChat">💬 CHAT</button>
                    <button class="btn" id="btnOpenSettings">⚙ CÀI ĐẶT</button>
                </div>
            </div>

            <div id="joystick-zone" class="hud-element"></div>

            <div id="chatPanel" class="hud-element">
                <div style="padding:4px 8px; background:rgba(0,0,0,0.4); font-size:10px; color:var(--cyan);">TRÒ CHUYỆN</div>
                <div class="chat-body" id="chatBody"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." maxlength="60">
                    <button class="btn" id="btnSendChat">GỬI</button>
                </div>
            </div>
        </div>

        <!-- POPUP CÀI ĐẶT -->
        <div class="overlay" id="settingsOverlay">
            <div class="panel setting-box">
                <div style="font-family:'Orbitron'; color:var(--gold); font-size:16px; text-align:center;">CÀI ĐẶT GAME</div>
                
                <div class="set-row">
                    <label>Độ thu phóng (Camera):</label>
                    <input type="range" id="setZoom" min="0.3" max="1.5" step="0.05" value="0.8">
                </div>
                <div class="set-row">
                    <label>Âm thanh Tổng:</label>
                    <input type="range" id="setVolume" min="0" max="1" step="0.1" value="0.8">
                </div>
                <div class="set-row">
                    <label>Đồ họa (Độ nét):</label>
                    <select id="setGraphics">
                        <option value="1">Tiêu chuẩn (1x)</option>
                        <option value="1.5" selected>Sắc nét (1.5x)</option>
                        <option value="2">Siêu nét (2x - Tốn RAM)</option>
                    </select>
                </div>
                <div class="set-row">
                    <label>Độ mờ HUD:</label>
                    <input type="range" id="setHudAlpha" min="0.2" max="1" step="0.1" value="0.9">
                </div>

                <button class="btn" id="btnEditHUD" style="border-color:var(--gold); color:var(--gold);">🛠 CHỈNH VỊ TRÍ & CỠ HUD</button>
                <button class="btn danger" id="btnLeaveMap">🚪 RỜI MAP VỀ SẢNH</button>
                <button class="btn gold" id="btnCloseSettings">LƯU & ĐÓNG</button>
            </div>
        </div>
    </div>

    <!-- Hộp lỗi (hiển thị khi có lỗi) -->
    <div id="errBox" style="display:none; position:fixed; inset:0; z-index:9999; background:#1a0000; color:#ff5555; padding:16px; font-family:monospace; font-size:13px; overflow:auto; white-space:pre-wrap;"></div>

    <!-- ==================== THƯ VIỆN ==================== -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>

    <!-- ==================== PHẦN 3: CONFIG ==================== -->
    <script>
        const CONFIG = {
            DISCORD_CLIENT_ID: '1534238453871673414',
            REDIRECT_URI: window.location.origin + window.location.pathname,
            MAPS: [
                { id: 'm1', name: 'KHU HUẤN LUYỆN' },
                { id: 'm2', name: 'DIỄU BINH' },
                { id: 'm3', name: 'THAO TRƯỜNG' },
                { id: 'm4', name: 'SỰ KIỆN' }
            ]
        };
    </script>

    <!-- ==================== PHẦN 4: MAIN SCRIPT ==================== -->
    <script>
        // ============================================================
        //  MAIN LOGIC
        // ============================================================
        let currentUser = null;
        let isEditHUD = false;
        let selectedMap = CONFIG.MAPS[0];
        let game = null, scene = null, playerContainer = null, joystick = null;
        let moveVector = { x: 0, y: 0 };
        let speechBubble = null;

        // ----------------- Discord OAuth -----------------
        function checkDiscordAuth() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get('access_token');

            if (accessToken) {
                fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${accessToken}` }
                })
                .then(res => res.json())
                .then(user => {
                    if (user.id) {
                        currentUser = user;
                        localStorage.setItem('vmi_discord_user', JSON.stringify(user));
                        window.history.replaceState({}, document.title, window.location.pathname);
                        updateUserUI();
                    }
                });
            } else {
                const saved = localStorage.getItem('vmi_discord_user');
                if (saved) { currentUser = JSON.parse(saved); updateUserUI(); }
            }
        }

        function updateUserUI() {
            if (currentUser) {
                const avUrl = currentUser.avatar 
                    ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=256`
                    : `https://cdn.discordapp.com/embed/avatars/0.png`;
                document.getElementById('avatarEl').innerHTML = `<img src="${avUrl}">`;
                document.getElementById('playerNameEl').textContent = currentUser.global_name || currentUser.username;
                document.getElementById('statusEl').textContent = '● Đã xác minh';
                document.getElementById('statusEl').style.color = 'var(--green)';
                document.getElementById('btnLogin').style.display = 'none';
                document.getElementById('btnLogout').style.display = 'block';
                document.getElementById('btnEnterGame').disabled = false;
            }
        }

        document.getElementById('btnLogin').onclick = () => {
            const url = `https://discord.com/oauth2/authorize?client_id=${CONFIG.DISCORD_CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(CONFIG.REDIRECT_URI)}&scope=identify`;
            window.location.href = url;
        };

        document.getElementById('btnLogout').onclick = () => {
            localStorage.removeItem('vmi_discord_user');
            location.reload();
        };

        // ----------------- Lobby Map Selection -----------------
        const mapRow = document.getElementById('mapRow');
        CONFIG.MAPS.forEach(m => {
            const card = document.createElement('div');
            card.className = 'map-card' + (m.id === selectedMap.id ? ' selected' : '');
            card.innerHTML = `<div style="font-weight:bold; font-size:12px;">${m.name}</div>`;
            card.onclick = () => {
                document.querySelectorAll('.map-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedMap = m;
                document.getElementById('mapLabel').textContent = m.name;
            };
            mapRow.appendChild(card);
        });

        document.getElementById('btnEnterGame').onclick = () => {
            document.getElementById('screen-menu').style.display = 'none';
            document.getElementById('screen-game').classList.add('active');
            initGame();
        };

        // ----------------- Phaser Game -----------------
        function initGame() {
            try {
                if (typeof Phaser === 'undefined') {
                    throw new Error('Phaser chưa load được (có thể do mạng chặn CDN jsdelivr.net)');
                }
                if (game) { game.destroy(true); game = null; }

                const renderScale = parseFloat(document.getElementById('setGraphics').value);

                const config = {
                    type: Phaser.AUTO,
                    parent: 'phaser-container',
                    width: window.innerWidth,
                    height: window.innerHeight,
                    resolution: renderScale,
                    backgroundColor: '#101726',
                    physics: { default: 'arcade' },
                    scene: { preload: preloadScene, create: createScene, update: updateScene }
                };

                game = new Phaser.Game(config);
                initJoystick();
            } catch (err) {
                const box = document.getElementById('errBox');
                box.style.display = 'block';
                box.textContent += 'LỖI initGame(): ' + err.message + '\n\n';
            }
        }

        function preloadScene() {
            scene = this;
            if (scene.textures.exists('p_avatar')) scene.textures.remove('p_avatar');

            const avUrl = currentUser && currentUser.avatar 
                ? `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=256`
                : `https://cdn.discordapp.com/embed/avatars/0.png`;

            scene.load.image('p_avatar', avUrl);
        }

        function createScene() {
            const MAP_SIZE = 9600;
            scene.physics.world.setBounds(0, 0, MAP_SIZE, MAP_SIZE);
            const startPos = MAP_SIZE / 2;

            // 1. Background grass + grid
            const bg = scene.add.graphics();
            bg.fillStyle(0x5c8a67, 1);
            bg.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
            bg.lineStyle(2, 0x4e7858, 0.3);
            for (let x = 0; x <= MAP_SIZE; x += 120) bg.lineBetween(x, 0, x, MAP_SIZE);
            for (let y = 0; y <= MAP_SIZE; y += 120) bg.lineBetween(0, y, MAP_SIZE, y);

            // 2. Spawn platform & flag
            scene.add.rectangle(startPos, startPos, 500, 500, 0xeeeeee).setStrokeStyle(4, 0xcccccc);
            const flagBase = scene.add.circle(startPos, startPos, 22, 0x777777).setStrokeStyle(3, 0x333333);
            const flagPole = scene.add.line(startPos, startPos, 0, 0, 0, -100, 0xffffff).setLineWidth(4);
            const flag = scene.add.rectangle(startPos + 22, startPos - 25, 44, 26, 0xda251d);
            const flagStar = scene.add.polygon(startPos + 22, startPos - 25, [0,-5, 2,-1, 5,-1, 2,1, 3,4, 0,2, -3,4, -2,1, -5,-1, -2,-1], 0xffff00);
            let isFlagUp = false;
            const flagGroup = scene.add.container(0, 0, [flag, flagStar]);
            flagBase.setInteractive({ cursor: 'pointer' });
            flagBase.on('pointerdown', () => {
                isFlagUp = !isFlagUp;
                scene.tweens.add({
                    targets: flagGroup,
                    y: isFlagUp ? -65 : 0,
                    duration: 1200,
                    ease: 'Power2'
                });
                if (typeof showRobloxBubbleChat === 'function') {
                    showRobloxBubbleChat(isFlagUp ? "Đã kéo cờ!" : "Đã hạ cờ!");
                }
            });

            // 3. Clusters of pads (6 clusters, 8x6 each)
            const clusterOffsetX = [-400, 0, 400, -400, 0, 400];
            const clusterOffsetY = [-700, -700, -700, -1100, -1100, -1100];
            for (let c = 0; c < 6; c++) {
                const baseX = startPos + clusterOffsetX[c];
                const baseY = startPos + clusterOffsetY[c];
                for (let row = 0; row < 6; row++) {
                    for (let col = 0; col < 8; col++) {
                        const px = baseX + (col - 3.5) * 40;
                        const py = baseY + (row - 2.5) * 40;
                        scene.add.rectangle(px, py, 30, 30, 0xffffff, 0.9).setStrokeStyle(2, 0x00e5ff);
                    }
                }
            }

            // 4. Gate and fences (obstacles)
            const gateY = startPos - 1500;
            const pillarLeft = scene.add.rectangle(startPos - 180, gateY, 40, 40, 0x8b0000).setStrokeStyle(2, 0x000000);
            const pillarRight = scene.add.rectangle(startPos + 180, gateY, 40, 40, 0x8b0000).setStrokeStyle(2, 0x000000);
            const fenceLeft = scene.add.rectangle(startPos - 1200, gateY, 2000, 18, 0xffd700).setStrokeStyle(2, 0xb8860b);
            const fenceRight = scene.add.rectangle(startPos + 1200, gateY, 2000, 18, 0xffd700).setStrokeStyle(2, 0xb8860b);

            const obstacles = scene.physics.add.staticGroup();
            obstacles.addMultiple([pillarLeft, pillarRight, fenceLeft, fenceRight]);

            // 5. Concrete road and trees
            const roadWidth = 450;
            const roadHeight = 2500;
            scene.add.rectangle(startPos, gateY - roadHeight / 2, roadWidth, roadHeight, 0x444444);
            for (let ly = gateY; ly > gateY - roadHeight; ly -= 80) {
                scene.add.rectangle(startPos, ly - 20, 8, 40, 0xffd700);
            }
            for (let cy = gateY - 80; cy > gateY - roadHeight; cy -= 110) {
                scene.add.circle(startPos - roadWidth / 2 - 35, cy, 28, 0x1e5631).setStrokeStyle(2, 0x0a2912);
                scene.add.circle(startPos + roadWidth / 2 + 35, cy, 28, 0x1e5631).setStrokeStyle(2, 0x0a2912);
            }

            // ---------- Tạo nhân vật (avatar + bubble) ----------
const r = 26;
const texKey = 'avatar_' + Date.now();
const rt = scene.textures.createCanvas(texKey, r * 2, r * 2);
const ctx = rt.getContext();
ctx.beginPath();
ctx.arc(r, r, r, 0, Math.PI * 2);
ctx.clip();
if (currentUser && currentUser.avatar) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { ctx.drawImage(img, 0, 0, r * 2, r * 2); rt.refresh(); };
    img.src = `https://cdn.discordapp.com/avatars/${currentUser.id}/${currentUser.avatar}.png?size=128`;
} else {
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(0, 0, r * 2, r * 2);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 24px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText((currentUser ? (currentUser.global_name || currentUser.username) : 'V')[0].toUpperCase(), r, r);
    rt.refresh();
}
const sprite = scene.add.image(0, 0, texKey);

const glow = scene.add.graphics();
glow.lineStyle(3, 0xffcc00, 0.8);
glow.strokeCircle(0, 0, r + 2);

const nameText = scene.add.text(0, r + 16, currentUser ? (currentUser.global_name || currentUser.username) : 'Player', {
    fontSize: '13px',
    fontFamily: 'Rajdhani',
    color: '#ffffff',
    stroke: '#000000',
    strokeThickness: 3
}).setOrigin(0.5);

const bubbleBg = scene.add.graphics();
const bubbleText = scene.add.text(0, 0, '', {
    fontSize: '11px',
    color: '#000',
    align: 'center',
    wordWrap: { width: 130 }
}).setOrigin(0.5);
const bubble = scene.add.container(0, -50, [bubbleBg, bubbleText]).setVisible(false);

playerContainer = scene.add.container(1500, 1500, [glow, sprite, nameText, bubble]);
scene.physics.world.enable(playerContainer);
playerContainer.body.setCollideWorldBounds(true);
playerContainer.body.setBoundsRectangle(new Phaser.Geom.Rectangle(0, 0, 3000, 3000));

const cam = scene.cameras.main;
cam.startFollow(playerContainer);
cam.setBounds(0, 0, 3000, 3000);
cam.setZoom(settings.zoom);

initJoystick();

window._showBubble = function(text) {
    bubbleText.setText(text);
    const b = bubbleText.getBounds();
    const pad = 8;
    bubbleBg.clear();
    bubbleBg.fillStyle(0xffffff, 0.92);
    bubbleBg.fillRoundedRect(-(b.width + pad * 2) / 2, -(b.height + pad * 2) / 2, b.width + pad * 2, b.height + pad * 2, 6);
    bubble.setPosition(0, -r - b.height - pad * 2 - 6);
    bubble.setVisible(true);
    clearTimeout(chatBubbleTimer);
    chatBubbleTimer = setTimeout(() => bubble.setVisible(false), 4000);
};
}

let lastTime = performance.now(), frameCount = 0, fpsVal = 60;

function updateScene() {
    if (!playerContainer) return;
    const speed = 180;
    let vx = 0, vy = 0;
    if (joystick && joystick.direction) {
        const { x, y } = joystick.vector;
        vx = x * speed;
        vy = y * speed;
    }
    playerContainer.body.setVelocity(vx, vy);
    frameCount++;
    const now = performance.now();
    if (now - lastTime >= 1000) {
        fpsVal = frameCount;
        frameCount = 0;
        lastTime = now;
        document.getElementById('fps-counter').textContent = `FPS: ${fpsVal}`;
    }
}

function initJoystick() {
    if (joystick) return;
    joystick = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '65px', top: '65px' },
        size: 110,
        color: '#00e5ff',
        restOpacity: 0.7
    });
    joystick.on('move', (_, d) => { joystick.direction = d.direction; joystick.vector = d.vector; })
        .on('end', () => { delete joystick.direction; delete joystick.vector; });
}

const chatBody = document.getElementById('chatBody'), chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn'), chatPanel = document.getElementById('chatPanel');
const chatCollapseBtn = document.getElementById('chatCollapseBtn'), btnChatToggle = document.getElementById('btnChatToggle');
let isChatCollapsed = false;

function addMessage(text, type = 'normal') {
    const div = document.createElement('div');
    div.className = 'msg' + (type === 'system' ? ' sys' : '');
    div.innerHTML = text;
    chatBody.appendChild(div);
    chatBody.scrollTop = chatBody.scrollHeight;
    if (chatBody.children.length > 50) chatBody.removeChild(chatBody.children[0]);
}

function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;
    const name = currentUser ? (currentUser.global_name || currentUser.username) : 'Khách';
    addMessage(`<span class="tag">${name}:</span> ${text}`);
    if (window._showBubble) window._showBubble(text);
    chatInput.value = '';
}
chatSendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

function toggleChat() {
    isChatCollapsed = !isChatCollapsed;
    chatPanel.classList.toggle('collapsed', isChatCollapsed);
    chatCollapseBtn.textContent = isChatCollapsed ? '▢' : '▁';
}
chatCollapseBtn.addEventListener('click', toggleChat);
btnChatToggle.addEventListener('click', toggleChat);

// SETTINGS
const settingsOverlay = document.getElementById('settingsOverlay');
const btnSettingsMenu = document.getElementById('btnSettingsMenu'), btnSettingsGame = document.getElementById('btnSettingsGame');
const closeSettings = document.getElementById('closeSettings'), settingsCloseBtn = document.getElementById('settingsCloseBtn');
const graphicsSelect = document.getElementById('graphicsSelect'), zoomRange = document.getElementById('zoomRange');
const hudOpacityRange = document.getElementById('hudOpacityRange'), hudScaleRange = document.getElementById('hudScaleRange');
const soundRange = document.getElementById('soundRange');
const hudEditToggle = document.getElementById('hudEditToggle'), hudResetBtn = document.getElementById('hudResetBtn');
let hudEditMode = false, draggedEl = null, dragOffset = { x: 0, y: 0 };

function applyHudSettings() {
    document.querySelectorAll('.hud-el').forEach(el => {
        el.style.opacity = settings.hudOpacity;
        el.style.transform = `scale(${settings.hudScale})`;
        el.style.transformOrigin = 'top left';
    });
    if (game && scene) scene.cameras.main.setZoom(settings.zoom);
    document.getElementById('graphicsVal').textContent = graphicsSelect.options[graphicsSelect.selectedIndex].text;
    document.getElementById('zoomVal').textContent = settings.zoom.toFixed(2) + 'x';
    document.getElementById('hudOpacityVal').textContent = Math.round(settings.hudOpacity * 100) + '%';
    document.getElementById('hudScaleVal').textContent = Math.round(settings.hudScale * 100) + '%';
    document.getElementById('soundVal').textContent = settings.sound + '%';
    soundRange.value = settings.sound;
    if (window._audioCtx) {
        try { window._audioCtx.gain.value = settings.sound / 100; } catch {}
    }
}

function openSettings() {
    settingsOverlay.classList.add('open');
    graphicsSelect.value = settings.graphics;
    zoomRange.value = settings.zoom;
    hudOpacityRange.value = settings.hudOpacity;
    hudScaleRange.value = settings.hudScale;
    soundRange.value = settings.sound;
    applyHudSettings();
}

function closeSettingsOverlay() {
    settingsOverlay.classList.remove('open');
    saveSettings();
}

btnSettingsMenu.addEventListener('click', openSettings);
btnSettingsGame.addEventListener('click', openSettings);
closeSettings.addEventListener('click', closeSettingsOverlay);
settingsCloseBtn.addEventListener('click', closeSettingsOverlay);

graphicsSelect.addEventListener('change', e => { settings.graphics = e.target.value; applyHudSettings(); });
zoomRange.addEventListener('input', e => { settings.zoom = parseFloat(e.target.value); applyHudSettings(); });
hudOpacityRange.addEventListener('input', e => { settings.hudOpacity = parseFloat(e.target.value); applyHudSettings(); });
hudScaleRange.addEventListener('input', e => { settings.hudScale = parseFloat(e.target.value); applyHudSettings(); });
soundRange.addEventListener('input', e => { settings.sound = parseInt(e.target.value); applyHudSettings(); });

function toggleHudEdit() {
    hudEditMode = !hudEditMode;
    hudEditToggle.textContent = hudEditMode ? 'TẮT' : 'BẬT';
    hudEditToggle.classList.toggle('danger', hudEditMode);
    document.querySelectorAll('.hud-el').forEach(el => {
        el.style.cursor = hudEditMode ? 'move' : '';
        if (!hudEditMode) el.classList.remove('hud-dragging');
    });
    toast(hudEditMode ? 'Đã bật chỉnh sửa HUD' : 'Đã tắt chỉnh sửa HUD');
}
hudEditToggle.addEventListener('click', toggleHudEdit);
hudResetBtn.addEventListener('click', () => {
    localStorage.removeItem('vmi_hud_pos');
    toast('Đã đặt lại vị trí → tải lại trang');
});

function saveHudPos(id, x, y) {
    try {
        const a = JSON.parse(localStorage.getItem('vmi_hud_pos') || '{}');
        a[id] = { x, y };
        localStorage.setItem('vmi_hud_pos', JSON.stringify(a));
    } catch {}
}

function loadHudPos() {
    try {
        const a = JSON.parse(localStorage.getItem('vmi_hud_pos') || '{}');
        Object.entries(a).forEach(([id, p]) => {
            const el = document.getElementById(id);
            if (el) {
                el.style.left = p.x + 'px';
                el.style.top = p.y + 'px';
                el.style.right = el.style.bottom = 'auto';
            }
        });
    } catch {}
}

// Kéo thả HUD (chuột)
document.addEventListener('mousedown', e => {
    if (!hudEditMode) return;
    const el = e.target.closest('.hud-el');
    if (!el || el.id === 'joystick-zone') return;
    draggedEl = el;
    el.classList.add('hud-dragging');
    const r = el.getBoundingClientRect();
    dragOffset.x = e.clientX - r.left;
    dragOffset.y = e.clientY - r.top;
});
document.addEventListener('mousemove', e => {
    if (!draggedEl) return;
    const x = Math.max(0, e.clientX - dragOffset.x);
    const y = Math.max(0, e.clientY - dragOffset.y);
    draggedEl.style.left = x + 'px';
    draggedEl.style.top = y + 'px';
    draggedEl.style.right = draggedEl.style.bottom = 'auto';
});
document.addEventListener('mouseup', () => {
    if (!draggedEl) return;
    draggedEl.classList.remove('hud-dragging');
    saveHudPos(draggedEl.id, parseFloat(draggedEl.style.left) || 0, parseFloat(draggedEl.style.top) || 0);
    draggedEl = null;
});

// Kéo thả HUD (cảm ứng)
document.addEventListener('touchstart', e => {
    if (!hudEditMode) return;
    const t = e.touches[0];
    const el = t.target.closest('.hud-el');
    if (!el || el.id === 'joystick-zone') return;
    e.preventDefault();
    draggedEl = el;
    el.classList.add('hud-dragging');
    const r = el.getBoundingClientRect();
    dragOffset.x = t.clientX - r.left;
    dragOffset.y = t.clientY - r.top;
}, { passive: false });
document.addEventListener('touchmove', e => {
    if (!draggedEl) return;
    e.preventDefault();
    const t = e.touches[0];
    const x = Math.max(0, t.clientX - dragOffset.x);
    const y = Math.max(0, t.clientY - dragOffset.y);
    draggedEl.style.left = x + 'px';
    draggedEl.style.top = y + 'px';
    draggedEl.style.right = draggedEl.style.bottom = 'auto';
}, { passive: false });
document.addEventListener('touchend', () => {
    if (!draggedEl) return;
    draggedEl.classList.remove('hud-dragging');
    saveHudPos(draggedEl.id, parseFloat(draggedEl.style.left) || 0, parseFloat(draggedEl.style.top) || 0);
    draggedEl = null;
});

// Vào / Thoát game
const btnEnterGame = document.getElementById('btnEnterGame');
const btnExitGame = document.getElementById('btnExitGame');

btnEnterGame.addEventListener('click', () => {
    if (!currentUser || !selectedMap) return;
    initGame();
    addMessage('<b>Hệ thống:</b> Đã vào bản đồ ' + selectedMap.name, 'system');
});
btnExitGame.addEventListener('click', () => {
    if (game) { game.destroy(true); game = null; }
    document.getElementById('screen-game').classList.remove('active');
    document.getElementById('screen-menu').style.display = 'flex';
});

// Khởi tạo
loadSettings();
loadHudPos();
applyHudSettings();

const savedUser = localStorage.getItem('vmi_user');
if (savedUser) {
    try { updateUserUI(JSON.parse(savedUser)); } catch { updateUserUI(null); }
} else {
    const redirectedUser = await handleRedirect();
    updateUserUI(redirectedUser);
}

setTimeout(() => { document.getElementById('onlineLabel').textContent = '4 người trực tuyến'; }, 600);

window.addEventListener('resize', () => { if (game) game.resize(window.innerWidth, window.innerHeight); });

window._audioCtx = { gain: { value: settings.sound / 100 } };
});
</script>
</body>
</html>
